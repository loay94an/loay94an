<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }
        :root {

            --card-bg: #ffffff; --text-color: #2d3748; --border-color: #cbd5e0;
        }
        body.dark {
            --primary: #4299c1; --primary-light: #63b3ed; --secondary: #68d391; --accent: #f6ad55;
            --gray-light: #2d3748; --gray: #4a5568; --dark: #f7fafc; --white: #1a202c;
            --bg-page: #1a202c; --card-bg: #2d3748; --text-color: #f7fafc; --border-color: #4a5568;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-page); color: var(--text-color); direction: rtl; padding: 1rem; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 1rem 1.5rem; border-radius: var(--radius); margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }

        .lang-select, .theme-toggle { background: rgba(255,255,255,0.2); border: none; border-radius: 40px; padding: 0.4rem 0.8rem; color: white; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .theme-toggle { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .selection-card { background: var(--card-bg); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
        .row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; align-items: flex-end; }
        .form-group { flex: 1; min-width: 150px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .form-group select, .form-group input { width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--white); color: var(--text-color); font-family: 'Tajawal', sans-serif; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; background: var(--gray-light); border: 1px solid var(--border-color); border-radius: 40px; cursor: pointer; font-weight: 500; font-size: 0.9rem; color: var(--text-color); }
        .btn.active { background: var(--secondary); border-color: var(--secondary); color: white; }
        .size-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; max-height: 140px; overflow-y: auto; padding: 0.5rem; background: var(--gray-light); border-radius: 10px; margin-top: 0.5rem; }
        .size-option { padding: 0.3rem 0.8rem; background: white; border: 1px solid var(--border-color); border-radius: 30px; cursor: pointer; font-size: 0.85rem; }
        .size-option.selected { background: var(--primary); color: white; }
        .tables-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .card-header { background: var(--primary); color: white; padding: 0.75rem 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .card-content { padding: 1rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 0.5rem 0.3rem; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { background: var(--gray-light); color: var(--primary); }
        .info-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--accent); }
        .formula-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border-radius: var(--radius); padding: 1rem; max-width: 300px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); direction: rtl; }
        .pattern-canvas-container { background: #fafafa; padding: 1rem; text-align: center; overflow-x: auto; }
        canvas { background: white; box-shadow: var(--shadow); border-radius: 8px; max-width: 100%; height: auto; }
        .instructions-card { margin-top: 1rem; }
        .instructions-content { padding: 1rem; line-height: 1.6; font-size: 0.9rem; max-height: 500px; overflow-y: auto; }
        .export-buttons { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
        .export-btn { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 40px; cursor: pointer; font-size: 0.85rem; }
        .footer { text-align: center; padding: 1rem; margin-top: 1rem; font-size: 0.75rem; color: var(--gray); }
        @media (max-width: 768px) { .tables-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">

    <div class="selection-card">

            <div class="form-group"><label id="gender-label">الجنس</label><div class="btn-group" id="gender-buttons"><button class="btn active" data-gender="women">نساء</button><button class="btn" data-gender="men">رجال</button><button class="btn" data-gender="kids">أطفال</button><button class="btn" data-gender="infant">رضع</button></div></div>
            <div class="form-group"><label id="unit-label">الوحدة</label><div class="btn-group" id="unit-buttons"><button class="btn active" data-unit="cm">سم</button><button class="btn" data-unit="in">إنش</button></div></div>
        </div>
        <div class="form-group"><label id="size-number-label">رقم المقاس</label><div id="size-buttons-container" class="size-buttons"></div></div>
        <div class="row">
            <div class="form-group"><label id="school-label">مدرسة الرسم</label><select id="school-select"><option value="german">🇩🇪 الألمانية (M. Müller & Sohn)</option><option value="italian">🇮🇹 الإيطالية (Sartorial)</option><option value="french">🇫🇷 الفرنسية (ESMOD)</option><option value="american">🇺🇸 الأمريكية (Armstrong)</option><option value="flat">📐 المسطح (للمبتدئين)</option></select></div>
            <div class="form-group"><label id="sleeve-type-label">نوع الكم</label><select id="sleeve-type"><option value="basic">أساسي (قطعة واحدة)</option><option value="twopiece">تايلور (قطعتين)</option><option value="raglan">ريكلان (راجلان)</option></select></div>
        </div>
        <div class="row" id="calculation-methods-row">
            <div class="form-group"><label id="armhole-method-label">عمق حفرة الإبط</label><div class="btn-group" id="armhole-method"><button class="btn active" data-method="formula">معادلة</button><button class="btn" data-method="direct">قياس مباشر</button></div></div>
            <div class="form-group"><label id="neckdrop-method-label">نزول الرقبة الأمامية</label><div class="btn-group" id="neckdrop-method"><button class="btn active" data-method="formula">معادلة</button><button class="btn" data-method="direct">قياس مباشر</button></div></div>
        </div>
    </div>

    <div id="tables-container" class="tables-container"></div>

    <div class="card">
        <div class="card-header"><i class="fas fa-drafting-compass"></i> <span id="pattern-title">رسم الباترون الأساسي</span></div>
        <div class="pattern-canvas-container"><canvas id="patternCanvas" width="850" height="650" style="max-width:100%; height:auto;"></canvas></div>
        <div class="export-buttons"><button class="export-btn" id="export-pdf"><i class="fas fa-file-pdf"></i> PDF</button><button class="export-btn" id="export-png"><i class="fas fa-image"></i> PNG</button><button class="export-btn" id="export-excel"><i class="fas fa-file-excel"></i> Excel</button></div>
    </div>

    <div class="card instructions-card"><div class="card-header"><span><i class="fas fa-list-ol"></i> <span id="instructions-title">تعليمات رسم الباترون (حسب المدرسة)</span></span></div><div class="instructions-content" id="instructions-content"></div></div>
    <div class="footer"><p id="footer-text">جميع الحسابات وفق المدارس العالمية – اضغط على ℹ️ لرؤية القاعدة والمعادلة</p></div>
</div>

<script>
    // ======================== متكامل مع بيانات شاملة وترجمة وحسابات دقيقة ========================
    const translations = {
        ar: { appTitle:"موسوعة الأجيال – مدارس رسم الباترون العالمية", systemLabel:"نظام المقاسات", genderLabel:"الجنس", unitLabel:"الوحدة", sizeNumberLabel:"رقم المقاس", bodyTableTitle:"المقاسات التفصيلية (19 قياساً)", patternTableTitle:"مقاسات الباترون الأساسي (ربع الباترون)", measurement:"القياس", value:"القيمة", explanation:"الشرح", patternTitle:"رسم الباترون الأساسي", instructionsTitle:"تعليمات رسم الباترون (حسب المدرسة)", footer:"جميع الحسابات وفق المدارس العالمية – اضغط على ℹ️ لرؤية القاعدة", unitCm:"سم", unitIn:"إنش", schoolLabel:"مدرسة الرسم", sleeveTypeLabel:"نوع الكم", armholeMethod:"طريقة عمق الإبط", neckdropMethod:"طريقة نزول الرقبة" },
        en: { appTitle:"Al-Ajyal Encyclopedia – International Pattern Drafting Schools", systemLabel:"Size System", genderLabel:"Gender", unitLabel:"Unit", sizeNumberLabel:"Size Number", bodyTableTitle:"Detailed Measurements (19 items)", patternTableTitle:"Basic Block Measurements (Quarter)", measurement:"Measurement", value:"Value", explanation:"Formula", patternTitle:"Basic Pattern Drafting", instructionsTitle:"Pattern Instructions by School", footer:"All calculations according to global schools – click ℹ️ for formula", unitCm:"cm", unitIn:"in", schoolLabel:"Drafting School", sleeveTypeLabel:"Sleeve Type", armholeMethod:"Armhole Depth Method", neckdropMethod:"Front Neck Drop Method" },
        es: { appTitle:"Enciclopedia Al-Ajyall – Escuelas Internacionales de Patronaje", systemLabel:"Sistema de tallas", genderLabel:"Género", unitLabel:"Unidad", sizeNumberLabel:"Talla", bodyTableTitle:"Medidas detalladas (19)", patternTableTitle:"Medidas del patrón base (cuarto)", measurement:"Medida", value:"Valor", explanation:"Fórmula", patternTitle:"Dibujo del patrón base", instructionsTitle:"Instrucciones por escuela", footer:"Cálculos según escuelas globales – clic ℹ️ para fórmula", unitCm:"cm", unitIn:"pulg", schoolLabel:"Escuela de patronaje", sleeveTypeLabel:"Tipo de manga", armholeMethod:"Método sisa", neckdropMethod:"Método caída escote" },
        de: { appTitle:"Al-Ajyal Enzyklopädie – Internationale Schnittkonstruktion", systemLabel:"Größensystem", genderLabel:"Geschlecht", unitLabel:"Einheit", sizeNumberLabel:"Größe", bodyTableTitle:"Detaillierte Maße (19)", patternTableTitle:"Grundschnitt Maße (Viertel)", measurement:"Maß", value:"Wert", explanation:"Formel", patternTitle:"Grundschnitt Zeichnung", instructionsTitle:"Anleitungen nach Schule", footer:"Berechnungen nach internationalen Schulen – klick ℹ️ für Formel", unitCm:"cm", unitIn:"zoll", schoolLabel:"Schnittschule", sleeveTypeLabel:"Ärmeltyp", armholeMethod:"Armlochtiefe Methode", neckdropMethod:"Vordere Halsausschnitt Methode" }
    };
    let currentGender = 'women', currentSystem = 'eu', currentUnit = 'cm', currentLang = 'ar', currentSleeveType = 'basic', currentSchool = 'german';
    let currentMethods = { armholeDepth: 'formula', frontNeckDrop: 'formula' };

    // ========== بيانات المقاسات الشاملة لكل جنس (مدرجة حسب المقاس الأساسي EU) ==========
    const womenData = { 34:{chest:84,waist:66,hip:92,backWidth:34,shoulderLength:12.2,backLength:37.5,sleeveLength:56,armCirc:27,cuffCirc:15.8,neckCirc:35,waistToHip:18,waistToKnee:57,legLength:98,skirtLength:58,chestLength:42,armholeCirc:41,waistToArmpit:27.5,shoulderToBust:23.5,bustPointDist:17.5,armholeDepth:20},
        36:{chest:88,waist:70,hip:96,backWidth:35,shoulderLength:12.7,backLength:38.5,sleeveLength:57,armCirc:28.5,cuffCirc:16.2,neckCirc:36.5,waistToHip:18.5,waistToKnee:57.5,legLength:99,skirtLength:59,chestLength:43,armholeCirc:42.5,waistToArmpit:28,shoulderToBust:24,bustPointDist:18,armholeDepth:20.8},
        38:{chest:92,waist:74,hip:100,backWidth:36,shoulderLength:13.2,backLength:39.5,sleeveLength:57,armCirc:29.5,cuffCirc:16.8,neckCirc:37.5,waistToHip:19,waistToKnee:58,legLength:100,skirtLength:60,chestLength:44,armholeCirc:43.5,waistToArmpit:28.8,shoulderToBust:24.5,bustPointDist:18.5,armholeDepth:21.5},
        40:{chest:96,waist:78,hip:104,backWidth:37,shoulderLength:13.6,backLength:40.5,sleeveLength:57.5,armCirc:30.5,cuffCirc:17.2,neckCirc:38.5,waistToHip:19.5,waistToKnee:58.5,legLength:100,skirtLength:60,chestLength:45,armholeCirc:44.5,waistToArmpit:29.2,shoulderToBust:25,bustPointDist:19,armholeDepth:22},
        42:{chest:100,waist:82,hip:108,backWidth:38,shoulderLength:14,backLength:41,sleeveLength:58,armCirc:31.5,cuffCirc:17.8,neckCirc:39.5,waistToHip:20,waistToKnee:59,legLength:101,skirtLength:61,chestLength:46,armholeCirc:45.5,waistToArmpit:30,shoulderToBust:25.5,bustPointDist:19.5,armholeDepth:22.5} };
    const menData = { 44:{chest:88,waist:78,hip:94,backWidth:35.5,shoulderLength:14,backLength:43,sleeveLength:61,armCirc:30,cuffCirc:18,neckCirc:38,waistToHip:19.5,waistToKnee:60,legLength:104,pantsLength:102,chestLength:44,armholeCirc:43,waistToArmpit:30,shoulderToChest:24.5,chestPointDist:18,armholeDepth:21},
        46:{chest:92,waist:82,hip:98,backWidth:36.5,shoulderLength:14.3,backLength:43.5,sleeveLength:61.5,armCirc:31,cuffCirc:18.5,neckCirc:39,waistToHip:20,waistToKnee:60.5,legLength:105,pantsLength:103,chestLength:44.5,armholeCirc:44,waistToArmpit:30.5,shoulderToChest:25,chestPointDist:18.5,armholeDepth:21.5},
        48:{chest:96,waist:86,hip:102,backWidth:37.5,shoulderLength:14.6,backLength:44,sleeveLength:62,armCirc:32,cuffCirc:19,neckCirc:40,waistToHip:20.5,waistToKnee:61,legLength:106,pantsLength:104,chestLength:45,armholeCirc:45,waistToArmpit:31,shoulderToChest:25.5,chestPointDist:19,armholeDepth:22},
        50:{chest:100,waist:90,hip:106,backWidth:38.5,shoulderLength:15,backLength:44.5,sleeveLength:62.5,armCirc:33,cuffCirc:19.5,neckCirc:41,waistToHip:21,waistToKnee:61.5,legLength:107,pantsLength:105,chestLength:46,armholeCirc:46,waistToArmpit:31.5,shoulderToChest:26,chestPointDist:19.5,armholeDepth:22.8} };
    const kidsData = { 2:{chest:54,waist:52,hip:57,backWidth:24,shoulderLength:8.5,backLength:23,sleeveLength:32,armCirc:18.5,cuffCirc:14,neckCirc:27,waistToHip:13,waistToKnee:32,legLength:54,skirtLength:32,chestLength:24,armholeCirc:29,waistToArmpit:17,shoulderToBust:13.5,bustPointDist:10.5,armholeDepth:14.5},
        4:{chest:58,waist:54,hip:60,backWidth:25,shoulderLength:9,backLength:26,sleeveLength:36,armCirc:19.5,cuffCirc:14.5,neckCirc:28,waistToHip:14,waistToKnee:36,legLength:62,skirtLength:36,chestLength:26,armholeCirc:30,waistToArmpit:18,shoulderToBust:14.5,bustPointDist:11,armholeDepth:15.5},
        6:{chest:62,waist:56,hip:64,backWidth:26,shoulderLength:9.5,backLength:29,sleeveLength:40,armCirc:20.5,cuffCirc:15,neckCirc:29,waistToHip:15,waistToKnee:40,legLength:70,skirtLength:40,chestLength:28,armholeCirc:31,waistToArmpit:19,shoulderToBust:15.5,bustPointDist:11.5,armholeDepth:16.5} };
    const infantData = { 3:{chest:44,waist:43,hip:46,backWidth:18,shoulderLength:7,backLength:20,sleeveLength:24,armCirc:17,cuffCirc:13,neckCirc:28,waistToHip:11,waistToKnee:28,legLength:48,skirtLength:30,chestLength:21,armholeCirc:28,waistToArmpit:15,shoulderToBust:10,bustPointDist:8,armholeDepth:13},
        6:{chest:48,waist:45,hip:49,backWidth:19,shoulderLength:7.5,backLength:22,sleeveLength:27,armCirc:18,cuffCirc:14,neckCirc:30,waistToHip:12,waistToKnee:30,legLength:54,skirtLength:32,chestLength:22,armholeCirc:30,waistToArmpit:16,shoulderToBust:11,bustPointDist:8.5,armholeDepth:14},
        9:{chest:52,waist:48,hip:53,backWidth:20,shoulderLength:8,backLength:24,sleeveLength:30,armCirc:19,cuffCirc:14.5,neckCirc:32,waistToHip:13,waistToKnee:32,legLength:60,skirtLength:34,chestLength:23,armholeCirc:32,waistToArmpit:17,shoulderToBust:12,bustPointDist:9,armholeDepth:15} };

    function getMeasurements() {
        let data; let sizeVal = currentSize;
        if(currentGender==='women') data = womenData[sizeVal] || womenData[38];
        else if(currentGender==='men') data = menData[sizeVal] || menData[48];
        else if(currentGender==='kids') data = kidsData[sizeVal] || kidsData[4];
        else data = infantData[sizeVal] || infantData[6];
        return { ...data };
    }

    let currentSize = 38;
    function getSizeList() { if(currentGender==='women') return [34,36,38,40,42]; if(currentGender==='men') return [44,46,48,50]; if(currentGender==='kids') return [2,4,6]; return [3,6,9]; }
    function mapSizeBySystem(rawSize) { if(currentSystem==='us' && currentGender==='women') return {34:4,36:6,38:8,40:10,42:12}[rawSize]||rawSize; if(currentSystem==='arab' && currentGender==='women') return rawSize+4; if(currentSystem==='asian' && currentGender==='women') return rawSize-26; return rawSize; }
    function getDisplaySizes() { return getSizeList().map(s=>mapSizeBySystem(s)); }

    function formatDim(v) { return currentUnit === 'in' ? (v/2.54).toFixed(2)+' '+ (currentLang==='ar'?'إنش':'in') : v.toFixed(1)+' '+ (currentLang==='ar'?'سم':'cm'); }

    function computeSchoolValues(meas) {
        let neckWidth, armholeDepth, frontNeckDrop, backNeckDrop=2.2, shoulderSlope;
        const chest=meas.chest, neck=meas.neckCirc, backLen=meas.backLength;
        if(currentSchool==='german'){ neckWidth=(chest/20)+2.2; armholeDepth=(chest/10)+10.8; frontNeckDrop=neck/5.2; shoulderSlope=4.5; }
        else if(currentSchool==='italian'){ neckWidth=neck/6; armholeDepth=(chest/4)-2; frontNeckDrop=neck/5.5; shoulderSlope=4.2; }
        else if(currentSchool==='french'){ neckWidth=(neck/24)+1.8; armholeDepth=backLen/2; frontNeckDrop=neck/5; shoulderSlope=4.8; }
        else if(currentSchool==='american'){ neckWidth=(neck/6)+0.7; armholeDepth=(chest/4)-1.2; frontNeckDrop=neck/5; shoulderSlope=4.3; }
        else{ neckWidth=7.8; armholeDepth=19.5; frontNeckDrop=8; shoulderSlope=3.5; }
        if(currentMethods.armholeDepth==='direct' && meas.armholeDepth) armholeDepth=meas.armholeDepth;
        if(currentMethods.frontNeckDrop==='direct' && meas.frontNeckDrop) frontNeckDrop=meas.frontNeckDrop;
        return { neckWidth, armholeDepth, frontNeckDrop, backNeckDrop, shoulderSlope, patternWidth:(meas.chest/2)+3.5, patternHeight:meas.backLength+1.8 };
    }

    function computePattern(meas) {
        const s = computeSchoolValues(meas);
        const chestQ=meas.chest/4, waistQ=meas.waist/4, hipQ=meas.hip/4;
        const sleeveWidth=(meas.chest/5)+3.5, sleeveCapHeight=s.armholeDepth*0.82;
        return {
            "طول الظهر":{value:meas.backLength, formula:`قياس مباشر: ${meas.backLength.toFixed(1)}`},
            "عرض الكتف":{value:meas.shoulderLength, formula:`قياس مباشر: ${meas.shoulderLength.toFixed(1)}`},
            "عرض حردة الرقبة":{value:s.neckWidth, formula:`حسب المدرسة: ${currentSchool}`},
            "نزول الرقبة الأمامية":{value:s.frontNeckDrop, formula:`${currentMethods.frontNeckDrop==='formula'?'معادلة':'قياس مباشر'}`},
            "عمق حفرة الإبط":{value:s.armholeDepth, formula:`${currentMethods.armholeDepth==='formula'?'معادلة':'قياس مباشر'}`},
            "عرض الصدر÷4":{value:chestQ, formula:`${meas.chest} ÷ 4 = ${chestQ.toFixed(1)}`},
            "عرض الخصر÷4":{value:waistQ, formula:`${meas.waist} ÷ 4 = ${waistQ.toFixed(1)}`},
            "عرض الورك÷4":{value:hipQ, formula:`${meas.hip} ÷ 4 = ${hipQ.toFixed(1)}`},
            "عرض الكم":{value:sleeveWidth, formula:`(${meas.chest}÷5)+3 = ${sleeveWidth.toFixed(1)}`},
            "ارتفاع رأس الكم":{value:sleeveCapHeight, formula:`عمق الإبط ×0.82 = ${sleeveCapHeight.toFixed(1)}`},
            "طول الكم":{value:meas.sleeveLength, formula:`قياس مباشر`},
            "ميل الكتف":{value:s.shoulderSlope, formula:`حسب المدرسة`},
            "المسافة بين الثديين":{value:meas.bustPointDist||meas.chestPointDist||18, formula:`مقاس`}
        };
    }

    function drawPattern(meas) {
        const canvas=document.getElementById('patternCanvas'); const ctx=canvas.getContext('2d');
        canvas.width=900; canvas.height=700; ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        const s=computeSchoolValues(meas); const chest=meas.chest;
        const width=(chest/2)+3.5; const height=meas.backLength+1.8;
        const scale=Math.min((canvas.width-120)/width, (canvas.height-100)/height, 3.5);
        const offX=70, offY=60; const rectW=width*scale, rectH=height*scale;
        ctx.strokeStyle='#2c5282'; ctx.lineWidth=1.8; ctx.strokeRect(offX,offY,rectW,rectH);
        ctx.fillStyle='rgba(44,82,130,0.05)'; ctx.fillRect(offX,offY,rectW,rectH);
        const midX=offX+rectW/2; ctx.beginPath(); ctx.moveTo(midX,offY); ctx.lineTo(midX,offY+rectH); ctx.strokeStyle='#aaa'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
        const chestY=offY+s.armholeDepth*scale; const waistY=offY+meas.backLength*scale;
        const hipY=offY+(meas.backLength-meas.waistToHip)*scale;
        ctx.beginPath(); ctx.moveTo(offX,chestY); ctx.lineTo(offX+rectW,chestY); ctx.strokeStyle='#e53e3e'; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(offX,waistY); ctx.lineTo(offX+rectW,waistY); ctx.strokeStyle='#48bb78'; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(offX,hipY); ctx.lineTo(offX+rectW,hipY); ctx.strokeStyle='#ed8936'; ctx.stroke();
        ctx.setLineDash([]);
        const neckTopX=offX+s.neckWidth*scale; const neckDropX=offX+rectW/2; const neckDropY=offY+s.frontNeckDrop*scale;
        ctx.beginPath(); ctx.moveTo(neckTopX,offY); ctx.quadraticCurveTo(offX+rectW/2,offY+5, neckDropX,neckDropY); ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
        const shoulderEndX=offX+(s.shoulderSlope+2.5)*scale; const shoulderEndY=offY+s.shoulderSlope*scale;
        ctx.beginPath(); ctx.moveTo(neckTopX,offY); ctx.lineTo(shoulderEndX,shoulderEndY); ctx.stroke();
        ctx.fillStyle='#1e3c72'; ctx.font="bold 14px 'Tajawal'"; ctx.fillText(`ربع الباترون - ${currentSchool}`, offX, offY-12);
        ctx.font="12px 'Tajawal'"; ctx.fillStyle='#2d3748';
        ctx.fillText(`عرض: ${formatDim(width)}`, offX+rectW/2, offY-5); ctx.fillText(`طول: ${formatDim(height)}`, offX+rectW+8, offY+rectH/2);
    }

    function generateInstructions(meas){
        const s=computeSchoolValues(meas);
        let html=`<div><h4>✂️ منهجية ${currentSchool} – ${currentSleeveType==='raglan'?'كم راجلان':currentSleeveType==='twopiece'?'كم تايلور':'كم أساسي'}</h4>`;
        html+=`<p>محيط الصدر: ${formatDim(meas.chest)} | طول الظهر: ${formatDim(meas.backLength)} | عمق الإبط: ${formatDim(s.armholeDepth)}</p>`;
        html+=`<ul><li>عرض حردة الرقبة = ${formatDim(s.neckWidth)}</li><li>نزول الرقبة الأمامية = ${formatDim(s.frontNeckDrop)}</li><li>ميل الكتف = ${s.shoulderSlope.toFixed(1)} ${currentUnit==='cm'?'سم':'in'}</li>`;
        html+=`<li>ارسم المستطيل بعرض = ${formatDim(s.patternWidth)} وارتفاع = ${formatDim(s.patternHeight)}</li>`;
        if(currentSleeveType==='raglan') html+=`<li><strong>كم الراجلان:</strong> يتم رسم خط قطري من حردة الرقبة إلى حفرة الإبط مع توسيع الإسفين.</li>`;
        else if(currentSleeveType==='twopiece') html+=`<li><strong>الكم التايلور:</strong> يتكون من جزأين علوي وسفلي لملاءمة دقيقة عند المرفق.</li>`;
        else html+=`<li><strong>الكم الأساسي:</strong> يرسم بارتفاع رأس الكم = ${formatDim(s.armholeDepth*0.82)} وعرض الكم = ${formatDim((meas.chest/5)+3.5)}.</li>`;
        html+=`<li>بعد الانتهاء، تضاف البنسات حسب المدرسة (صدرية أو خصرية).</li></ul></div>`;
        return html;
    }

    function renderTables(){
        const meas=getMeasurements(); const pattern=computePattern(meas); const t=translations[currentLang]||translations.ar;
        const bodyKeys=["عرض الظهر","طول الكتف","طول الظهر","طول الكم","محيط الذراع","محيط الأسوارة","محيط الرقبة","محيط الصدر","محيط الخصر","محيط الورك","من الخصر إلى الورك","من الخصر إلى الركبة","طول الساق","طول التنورة/البنطلون","محيط الإبط","عمق الإبط مباشر"];
        const bodyVals=[meas.backWidth,meas.shoulderLength,meas.backLength,meas.sleeveLength,meas.armCirc,meas.cuffCirc,meas.neckCirc,meas.chest,meas.waist,meas.hip,meas.waistToHip,meas.waistToKnee,meas.legLength,meas.skirtLength||meas.pantsLength||meas.skirtLength,meas.armholeCirc,meas.armholeDepth];
        const bodyHtml=`<div class="card"><div class="card-header">${t.bodyTableTitle}</div><div class="card-content"><table><thead><tr><th>${t.measurement}</th><th>${t.value} (${currentUnit==='cm'?t.unitCm:t.unitIn})</th></tr></thead><tbody>${bodyKeys.map((k,i)=>`<tr><td>${k}</td><td><strong>${formatDim(bodyVals[i])}</strong></td></tr>`).join('')}</tbody></table></div></div>`;
        const patternHtml=`<div class="card"><div class="card-header">${t.patternTableTitle}</div><div class="card-content"><table><thead><tr><th>${t.measurement}</th><th>${t.value}</th><th>${t.explanation}</th></tr></thead><tbody>${Object.entries(pattern).map(([k,{value,formula}])=>`<tr><td>${k}</td><td><strong>${formatDim(value)}</strong></td><td><button class="info-btn" data-info="${formula}"><i class="fas fa-info-circle"></i></button></td></tr>`).join('')}</tbody></table></div></div>`;
        document.getElementById('tables-container').innerHTML=bodyHtml+patternHtml;
        document.querySelectorAll('.info-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ const pop=document.createElement('div'); pop.className='formula-popup'; pop.innerHTML=`<div><strong>القاعدة:</strong><br>${btn.dataset.info}</div><button style="margin-top:8px;" class="btn">إغلاق</button>`; document.body.appendChild(pop); pop.querySelector('button').onclick=()=>pop.remove(); setTimeout(()=>pop.remove(),5000); }));
        drawPattern(meas); document.getElementById('instructions-content').innerHTML=generateInstructions(meas);
    }

    function buildSizeButtons(){
        const sizesRaw=getSizeList(); const container=document.getElementById('size-buttons-container');
        container.innerHTML=sizesRaw.map(s=>`<div class="size-option ${s===currentSize?'selected':''}" data-size="${s}">${mapSizeBySystem(s)}</div>`).join('');
        document.querySelectorAll('.size-option').forEach(opt=>opt.addEventListener('click',()=>{ currentSize=parseInt(opt.dataset.size); buildSizeButtons(); renderTables(); }));
    }

    function updateUI(){
        const t=translations[currentLang]||translations.ar;
        document.getElementById('app-title').innerText=t.appTitle; document.getElementById('system-label').innerText=t.systemLabel;
        document.getElementById('gender-label').innerText=t.genderLabel; document.getElementById('unit-label').innerText=t.unitLabel;
        document.getElementById('size-number-label').innerText=t.sizeNumberLabel; document.getElementById('pattern-title').innerText=t.patternTitle;
        document.getElementById('instructions-title').innerText=t.instructionsTitle; document.getElementById('school-label').innerText=t.schoolLabel;
        document.getElementById('sleeve-type-label').innerText=t.sleeveTypeLabel; document.getElementById('armhole-method-label').innerText=t.armholeMethod||"عمق الإبط";
        document.getElementById('neckdrop-method-label').innerText=t.neckdropMethod||"نزول الرقبة";
        document.getElementById('footer-text').innerHTML=t.footer;
        document.querySelector('#gender-buttons button[data-gender="women"]').innerText=(currentLang==='ar'?'نساء':currentLang==='en'?'Women':'Mujeres'); 
        document.querySelector('#gender-buttons button[data-gender="men"]').innerText=(currentLang==='ar'?'رجال':currentLang==='en'?'Men':'Hombres');
        document.querySelector('#gender-buttons button[data-gender="kids"]').innerText=(currentLang==='ar'?'أطفال':currentLang==='en'?'Kids':'Niños');
        document.querySelector('#gender-buttons button[data-gender="infant"]').innerText=(currentLang==='ar'?'رضع':currentLang==='en'?'Infant':'Bebés');
        document.querySelectorAll('#unit-buttons .btn').forEach(btn=>btn.innerText=btn.dataset.unit==='cm'?t.unitCm:t.unitIn);
        buildSizeButtons(); renderTables();
    }

    function switchGender(g){ currentGender=g; currentSize=getSizeList()[0]; buildSizeButtons(); renderTables(); }
    function switchUnit(u){ currentUnit=u; renderTables(); }
    function exportExcel(){
        const meas=getMeasurements(); const pattern=computePattern(meas);
        const wsData=[["القياس","القيمة"]].concat(Object.entries(pattern).map(([k,{value}])=>[k,formatDim(value)]));
        const ws=XLSX.utils.aoa_to_sheet(wsData); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Pattern"); XLSX.writeFile(wb,"pattern_data.xlsx");
    }
    function exportPNG(){ const canvas=document.getElementById('patternCanvas'); const link=document.createElement('a'); link.download='pattern.png'; link.href=canvas.toDataURL(); link.click(); }
    function exportPDF(){ alert("PDF generated via html2pdf (simulated)"); }

    document.querySelectorAll('#gender-buttons .btn').forEach(btn=>btn.addEventListener('click',()=>switchGender(btn.dataset.gender)));
    document.querySelectorAll('#unit-buttons .btn').forEach(btn=>btn.addEventListener('click',()=>switchUnit(btn.dataset.unit)));
    document.getElementById('size-system').addEventListener('change',e=>{ currentSystem=e.target.value; buildSizeButtons(); renderTables(); });
    document.getElementById('sleeve-type').addEventListener('change',e=>{ currentSleeveType=e.target.value; renderTables(); });
    document.getElementById('school-select').addEventListener('change',e=>{ currentSchool=e.target.value; renderTables(); });
    document.getElementById('lang-select').addEventListener('change',e=>{ currentLang=e.target.value; updateUI(); });
    document.getElementById('export-png').addEventListener('click',exportPNG); document.getElementById('export-excel').addEventListener('click',exportExcel);
    document.getElementById('export-pdf').addEventListener('click',exportPDF);
    document.getElementById('armhole-method').addEventListener('click',e=>{ if(e.target.dataset.method){ currentMethods.armholeDepth=e.target.dataset.method; renderTables(); } });
    document.getElementById('neckdrop-method').addEventListener('click',e=>{ if(e.target.dataset.method){ currentMethods.frontNeckDrop=e.target.dataset.method; renderTables(); } });
    function init(){ updateUI(); if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark'); document.getElementById('theme-toggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); localStorage.setItem('darkMode',document.body.classList.contains('dark')); }); }
    init();
</script>
</body>
