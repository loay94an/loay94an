<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geodesic Dome Generator</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; 
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Header for Mobile */
        .mobile-header {
            display: none;
            background: #1e293b;
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }
        
        .menu-toggle {
            background: none;
            border: none;
            color: #00d1b2;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        
        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Sidebar - Hidden on mobile by default */
        #sidebar {
            width: 320px;
            background: #1e293b;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #334155;
            transition: transform 0.3s ease;
        }
        
        /* Viewer Area */
        #viewer { 
            flex: 1; 
            position: relative;
            background: #0a0f1a;
        }
        
        /* Controls */
        h2 { 
            color: #00d1b2; 
            margin-bottom: 20px; 
            font-size: 1.3rem;
            text-align: center;
        }
        
        .control-group { 
            margin-bottom: 18px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        label { 
            display: block; 
            color: #94a3b8; 
            margin-bottom: 6px; 
            font-size: 14px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00d1b2;
            box-shadow: 0 0 0 2px rgba(0, 209, 178, 0.2);
        }
        
        /* Slider Styling */
        input[type="range"] {
            height: 32px;
            padding: 0;
            background: transparent;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat { 
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat:hover {
            transform: translateY(-2px);
            border-color: #00d1b2;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        
        .stat-value { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: #00d1b2;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d1b2, #00a693);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #00a693, #00897b);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* Controls Info */
        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            font-size: 13px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .mobile-touch-controls {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
        }
        
        .touch-btn {
            background: rgba(0, 209, 178, 0.1);
            border: 1px solid #00d1b2;
            color: #00d1b2;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            #sidebar {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: 85%;
                max-width: 320px;
                transform: translateX(100%);
                z-index: 1001;
                padding-top: 60px;
                box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            }
            
            #sidebar.active {
                transform: translateX(0);
            }
            
            #viewer {
                height: calc(100vh - 60px);
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls-info {
                left: 10px;
                right: 10px;
                bottom: 10px;
                font-size: 12px;
            }
            
            .main-content {
                height: calc(100vh - 60px);
            }
        }
        
        @media (max-width: 480px) {
            #sidebar {
                width: 90%;
                padding: 20px 15px;
            }
            
            .stat {
                padding: 12px 8px;
            }
            
            .stat-value {
                font-size: 1.1rem;
            }
            
            .btn {
                padding: 12px;
                font-size: 15px;
            }
        }
        
        /* Overlay for mobile menu */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        
        .overlay.active {
            display: block;
        }
        
        /* Slider value display */
        .slider-container {
            position: relative;
            margin-top: 5px;
        }
        
        .slider-value {
            position: absolute;
            top: -25px;
            right: 0;
            background: #00d1b2;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* Close button for mobile */
        .close-menu {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #00d1b2;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }
        
        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00d1b2;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="menu-toggle" onclick="toggleMenu()">☰ القائمة</button>
        <div style="color: #00d1b2; font-weight: bold;">Geodesic Dome</div>
        <div style="width: 40px;"></div> <!-- spacer for centering -->
    </div>
    
    <!-- Menu Overlay -->
    <div class="overlay" onclick="toggleMenu()"></div>
    
    <div class="container">
        <div class="main-content">
            <!-- Sidebar Menu -->
            <aside id="sidebar">
                <button class="close-menu" onclick="toggleMenu()">×</button>
                
                <h2>Geodesic Dome Generator</h2>
                
                <div class="control-group">
                    <label>نصف القطر: <span id="radiusValue">2.0 م</span></label>
                    <div class="slider-container">
                        <input type="range" id="radius" min="0.5" max="5" step="0.1" value="2.0">
                    </div>
                </div>
                
                <div class="control-group">
                    <label>التردد (V)</label>
                    <select id="frequency">
                        <option value="1">1V</option>
                        <option value="2">2V</option>
                        <option value="3" selected>3V</option>
                        <option value="4">4V</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>الارتفاع: <span id="heightValue">1.5 م</span></label>
                    <div class="slider-container">
                        <input type="range" id="height" min="0.5" max="3" step="0.1" value="1.5">
                    </div>
                </div>
                
                <div class="control-group">
                    <label>لون القبة</label>
                    <select id="color">
                        <option value="#00d1b2">أخضر</option>
                        <option value="#3b82f6">أزرق</option>
                        <option value="#ef4444">أحمر</option>
                        <option value="#fbbf24">أصفر</option>
                        <option value="#8b5cf6">بنفسجي</option>
                    </select>
                </div>
                
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">عدد الأضلاع</div>
                        <div id="strutsCount" class="stat-value">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">المساحة</div>
                        <div id="surfaceArea" class="stat-value">0 م²</div>
                    </div>
                </div>
                
                <button class="btn" onclick="exportData()">
                    <span>📥</span> تصدير البيانات
                </button>
                
                <button class="btn" onclick="resetToDefaults()" style="margin-top: 10px; background: linear-gradient(135deg, #64748b, #475569);">
                    <span>🔄</span> إعادة التعيين
                </button>
                
                <div class="control-group" style="margin-top: 25px;">
                    <label>تعليمات الاستخدام:</label>
                    <div style="font-size: 13px; color: #94a3b8; line-height: 1.6; padding: 12px; background: rgba(15, 23, 42, 0.5); border-radius: 8px;">
                        • اسحب بإصبعك لتدوير القبة<br>
                        • قرص للتكبير والتصغير<br>
                        • اضغط على أيقونة القائمة للتحكم<br>
                        • التغييرات تحدث تلقائياً
                    </div>
                </div>
            </aside>
            
            <!-- 3D Viewer -->
            <div id="viewer">
                <div class="controls-info">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="color: #00d1b2;">التفاعلية:</strong>
                        <span id="updateStatus" style="font-size: 12px; color: #10b981;">جاهز</span>
                    </div>
                    <div>جرب تغيير القيم في الشريط الجانبي</div>
                    
                    <div class="mobile-touch-controls">
                        <button class="touch-btn" onclick="rotateLeft()">◀ تدوير</button>
                        <button class="touch-btn" onclick="resetView()">🔄 إعادة</button>
                        <button class="touch-btn" onclick="rotateRight()">تدوير ▶</button>
                    </div>
                </div>
                
                <div id="loading" class="loading">
                    جاري تحميل المحرك ثلاثي الأبعاد...
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>

    <script>
        // متغيرات عامة
        let domeEngine;
        let isMobile = window.innerWidth <= 768;
        
        // تهيئة المحرك ثلاثي الأبعاد
        class GeodesicDome {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.dome = null;
                this.isUpdating = false;
                
                this.init();
                this.setupEventListeners();
                this.updateDome();
                this.animate();
                
                // إخفاء شاشة التحميل
                document.getElementById('loading').style.display = 'none';
            }
            
            init() {
                // المشهد
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0f1a);
                
                // الكاميرا
                const viewer = document.getElementById('viewer');
                const aspect = viewer.clientWidth / viewer.clientHeight;
                this.camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
                this.camera.position.set(5, 3, 5);
                
                // العارض
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    alpha: true 
                });
                this.renderer.setSize(viewer.clientWidth, viewer.clientHeight);
                this.renderer.shadowMap.enabled = true;
                viewer.appendChild(this.renderer.domElement);
                
                // التحكم
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.1;
                this.controls.rotateSpeed = 0.8;
                this.controls.enableZoom = true;
                this.controls.enablePan = true;
                
                // تكوين خاص للجوال
                if (isMobile) {
                    this.controls.enableZoom = true;
                    this.controls.enablePan = false;
                }
                
                // الإضاءة
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 15, 10);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                
                // إضاءة إضافية
                const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3);
                this.scene.add(hemisphereLight);
                
                // الشبكة الأرضية
                const grid = new THREE.GridHelper(15, 15, 0x334155, 0x1e293b);
                grid.position.y = -2;
                this.scene.add(grid);
                
                // تعديل حجم النافذة
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            onWindowResize() {
                const viewer = document.getElementById('viewer');
                this.camera.aspect = viewer.clientWidth / viewer.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(viewer.clientWidth, viewer.clientHeight);
            }
            
            createIcosahedron(radius) {
                const phi = (1 + Math.sqrt(5)) / 2;
                const vertices = [
                    [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
                    [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
                    [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
                ].map(v => new THREE.Vector3(...v).normalize().multiplyScalar(radius));
                
                return vertices;
            }
            
            createDomeGeometry(radius, frequency, height, color) {
                const vertices = this.createIcosahedron(radius);
                
                const faces = [
                    [0,11,5], [0,5,1], [0,1,7], [0,7,10], [0,10,11],
                    [1,5,9], [5,11,4], [11,10,2], [10,7,6], [7,1,8],
                    [3,9,4], [3,4,2], [3,2,6], [3,6,8], [3,8,9],
                    [4,9,5], [2,4,11], [6,2,10], [8,6,7], [9,8,1]
                ];
                
                const group = new THREE.Group();
                const edgeSet = new Set();
                
                // إنشاء الأضلاع
                let strutCount = 0;
                faces.forEach(face => {
                    for(let i = 0; i < 3; i++) {
                        const v1 = vertices[face[i]];
                        const v2 = vertices[face[(i + 1) % 3]];
                        
                        // فلترة حسب الارتفاع
                        const cutoff = radius - height * 2;
                        if (v1.y < cutoff || v2.y < cutoff) {
                            continue;
                        }
                        
                        // إنشاء مفتاح فريد للضلع
                        const key1 = `${v1.x.toFixed(2)},${v1.y.toFixed(2)},${v1.z.toFixed(2)}`;
                        const key2 = `${v2.x.toFixed(2)},${v2.y.toFixed(2)},${v2.z.toFixed(2)}`;
                        const key = [key1, key2].sort().join('-');
                        
                        if (!edgeSet.has(key)) {
                            edgeSet.add(key);
                            
                            const length = v1.distanceTo(v2);
                            const geometry = new THREE.CylinderGeometry(0.03, 0.03, length, 6);
                            const material = new THREE.MeshPhongMaterial({ 
                                color: new THREE.Color(color),
                                shininess: 40,
                                specular: 0x222222
                            });
                            
                            const cylinder = new THREE.Mesh(geometry, material);
                            cylinder.castShadow = true;
                            cylinder.receiveShadow = true;
                            
                            // وضع الأسطوانة بين النقطتين
                            const center = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
                            cylinder.position.copy(center);
                            
                            // توجيه الأسطوانة
                            cylinder.lookAt(v2);
                            cylinder.rotateX(Math.PI / 2);
                            
                            group.add(cylinder);
                            strutCount++;
                        }
                    }
                });
                
                // إنشاء وصلات عند التقاطعات
                vertices.forEach(vertex => {
                    const cutoff = radius - height * 2;
                    if (vertex.y >= cutoff) {
                        const geometry = new THREE.SphereGeometry(0.06, 8, 8);
                        const material = new THREE.MeshPhongMaterial({ 
                            color: 0xffffff,
                            shininess: 80,
                            specular: 0x333333
                        });
                        const sphere = new THREE.Mesh(geometry, material);
                        sphere.position.copy(vertex);
                        sphere.castShadow = true;
                        group.add(sphere);
                    }
                });
                
                return { group, strutCount };
            }
            
            updateDome() {
                if (this.isUpdating) return;
                
                this.isUpdating = true;
                document.getElementById('updateStatus').textContent = 'جاري التحديث...';
                document.getElementById('updateStatus').style.color = '#fbbf24';
                
                // إزالة القبة القديمة
                if (this.dome) {
                    this.scene.remove(this.dome);
                }
                
                // قراءة القيم
                const radius = parseFloat(document.getElementById('radius').value);
                const frequency = parseInt(document.getElementById('frequency').value);
                const height = parseFloat(document.getElementById('height').value);
                const color = document.getElementById('color').value;
                
                // تحديث قيم العرض
                document.getElementById('radiusValue').textContent = radius.toFixed(1) + ' م';
                document.getElementById('heightValue').textContent = height.toFixed(1) + ' م';
                
                // إنشاء القبة الجديدة
                try {
                    const result = this.createDomeGeometry(radius, frequency, height, color);
                    this.dome = result.group;
                    this.scene.add(this.dome);
                    
                    // تحديث الإحصائيات
                    document.getElementById('strutsCount').textContent = result.strutCount;
                    const area = (Math.PI * radius * height).toFixed(1);
                    document.getElementById('surfaceArea').textContent = area + ' م²';
                    
                    // تحديث موضع الكاميرا بناءً على حجم القبة
                    const cameraDistance = Math.max(radius * 2.5, 4);
                    this.camera.position.set(cameraDistance, cameraDistance * 0.6, cameraDistance);
                    this.controls.update();
                    
                    document.getElementById('updateStatus').textContent = 'محدث';
                    document.getElementById('updateStatus').style.color = '#10b981';
                    
                } catch (error) {
                    console.error('Error creating dome:', error);
                    document.getElementById('updateStatus').textContent = 'خطأ في التحديث';
                    document.getElementById('updateStatus').style.color = '#ef4444';
                }
                
                this.isUpdating = false;
            }
            
            setupEventListeners() {
                // إضافة مستمعي الأحداث لجميع عناصر الإدخال
                const inputs = ['radius', 'frequency', 'height', 'color'];
                
                inputs.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.addEventListener('input', () => {
                            this.updateDome();
                        });
                        element.addEventListener('change', () => {
                            this.updateDome();
                        });
                    }
                });
                
                // تحديث قيم السلايدر أثناء السحب
                document.getElementById('radius').addEventListener('input', (e) => {
                    document.getElementById('radiusValue').textContent = e.target.value + ' م';
                });
                
                document.getElementById('height').addEventListener('input', (e) => {
                    document.getElementById('heightValue').textContent = e.target.value + ' م';
                });
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }
        
        // وظائف التحكم بالموبايل
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        
        function rotateLeft() {
            if (domeEngine && domeEngine.controls) {
                domeEngine.controls.rotateLeft(Math.PI / 8);
            }
        }
        
        function rotateRight() {
            if (domeEngine && domeEngine.controls) {
                domeEngine.controls.rotateRight(Math.PI / 8);
            }
        }
        
        function resetView() {
            if (domeEngine && domeEngine.camera) {
                domeEngine.camera.position.set(5, 3, 5);
                domeEngine.controls.reset();
            }
        }
        
        function resetToDefaults() {
            document.getElementById('radius').value = 2.0;
            document.getElementById('frequency').value = 3;
            document.getElementById('height').value = 1.5;
            document.getElementById('color').value = '#00d1b2';
            
            document.getElementById('radiusValue').textContent = '2.0 م';
            document.getElementById('heightValue').textContent = '1.5 م';
            
            if (domeEngine) {
                domeEngine.updateDome();
            }
            
            // إغلاق القائمة على الموبايل
            if (isMobile) {
                toggleMenu();
            }
        }
        
        // دالة التصدير
        function exportData() {
            const data = {
                radius: document.getElementById('radius').value,
                frequency: document.getElementById('frequency').value,
                height: document.getElementById('height').value,
                color: document.getElementById('color').value,
                struts: document.getElementById('strutsCount').textContent,
                area: document.getElementById('surfaceArea').textContent,
                timestamp: new Date().toISOString()
            };
            
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `geodesic-dome-${new Date().getTime()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // رسالة تأكيد
            alert('تم تصدير بيانات القبة بنجاح!');
        }
        
        // تهيئة المحرك عند تحميل الصفحة
        window.addEventListener('load', () => {
            domeEngine = new GeodesicDome();
            
            // إضافة دعم اللمس للجوال
            if (isMobile) {
                document.addEventListener('touchstart', function(e) {
                    // منع التمرير عند لمس منطقة التحكم
                    if (e.target.closest('.controls-info')) {
                        e.stopPropagation();
                    }
                }, { passive: true });
            }
        });
        
        // التعامل مع تغيير حجم النافذة
        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 768;
            if (domeEngine) {
                domeEngine.onWindowResize();
            }
        });
    </script>
</body>
</html>
