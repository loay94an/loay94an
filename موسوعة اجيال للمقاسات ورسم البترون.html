<!DOCTYPE html>

            --border-color: #cbd5e0;
        }

            --primary: #4299c1;
            --primary-light: #63b3ed;
            --secondary: #68d391;
            --accent: #f6ad55;
            --gray-light: #2d3748;
            --gray: #4a5568;
            --dark: #f7fafc;
            --white: #1a202c;

            margin: 0 auto;

            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;

            gap: 0.75rem;
            align-items: center;
        }
        .lang-select, .theme-toggle {

            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;

        .theme-toggle {

            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 180px;
        }
        .btn-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary);
        }
        .btn-group .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .btn.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }
        .size-buttons {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .size-buttons .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 180px;
            overflow-y: auto;
            padding: 0.25rem;

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .card-header {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1rem;
            font-weight: 600;
        }
        .card-content {
            padding: 1rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {

            text-align: center;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background: var(--gray-light);
            color: var(--primary);

            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--primary);
            transition: 0.2s;
        }
        .info-btn:hover {
            color: var(--accent);
        }

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;

</head>

<div class="container">
    <div class="header">

        <div class="header-controls">
            <select id="lang-select" class="lang-select">

                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
            <button id="theme-toggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="buttons-row">
        <div class="btn-group">
            <label id="system-label">نظام المقاسات</label>
            <div class="btns" id="system-buttons">
                <button class="btn active" data-system="eu">🇪🇺 EU</button>
                <button class="btn" data-system="us">🇺🇸 US</button>
                <button class="btn" data-system="arab">🇸🇦 Arab</button>
                <button class="btn" data-system="asian">🇯🇵 Asian</button>
            </div>
        </div>
        <div class="btn-group">
            <label id="gender-label">الجنس</label>
            <div class="btns" id="gender-buttons">
                <button class="btn active" data-gender="women">نساء</button>
                <button class="btn" data-gender="men">رجال</button>
                <button class="btn" data-gender="kids">أطفال</button>
                <button class="btn" data-gender="infant">رضع</button>
            </div>
        </div>
        <div class="btn-group">
            <label id="unit-label">الوحدة</label>
            <div class="btns" id="unit-buttons">
                <button class="btn active" data-unit="cm">سم (cm)</button>
                <button class="btn" data-unit="in">إنش (in)</button>
            </div>
        </div>
    </div>

    <div class="size-buttons">
        <label id="size-label">اختر المقاس</label>
        <div id="size-buttons-container" class="btns"></div>
    </div>

    <div id="tables-container" class="tables-grid"></div>

    <div class="export-section">
        <button class="export-btn" id="export-excel"><i class="fas fa-file-excel"></i> <span id="export-text">تصدير Excel (جداول الجسم والباترون)</span></button>
    </div>

    <div class="footer">
        <p id="footer-text">جميع الحسابات وفق المنهج العلمي – اضغط على أيقونة <i class="fas fa-info-circle"></i> بجانب القياس لرؤية شرح القاعدة والمعادلة بالأرقام</p>
    </div>
</div>

    // دوال تحويل المقاسات بين الأنظمة
    function womenSizeToEU(system, size) {
        if(system==='eu') return size;
        if(system==='us') { let m={4:34,6:36,8:38,10:40,12:42,14:44,16:46,18:48,20:50,22:52,24:54,26:56}; return m[size]||38; }
        if(system==='arab') return size;
        if(system==='asian') return size-4;
        return size;
    }
    function menSizeToEU(system, size) {
        if(system==='eu') return size;
        if(system==='us') { let m={30:40,32:42,34:44,36:46,38:48,40:50,42:52,44:54,46:56,48:58,50:60,52:62}; return m[size]||48; }
        if(system==='arab') return size;
        if(system==='asian') return size-4;
        return size;
    }

    // دوال الحصول على القياسات حسب النوع
    function getWomenMeasurements(system, size) {
        let eu = womenSizeToEU(system, size);
        let diff = (eu-38)/2;
        let factor = system==='asian'?0.97:(system==='arab'?1.02:1);
        const chest = (womenBaseEU.chest + diff*4)*factor;
        const waist = (womenBaseEU.waist + diff*4)*factor;
        const hip = (womenBaseEU.hip + diff*4)*factor;
        const backWidth = (womenBaseEU.backWidth + diff*1.2)*factor;
        const shoulderLength = (womenBaseEU.shoulderLength + diff*0.3)*factor;
        const backLength = (womenBaseEU.backLength + diff*0.8)*factor;
        const sleeveLength = (womenBaseEU.sleeveLength + diff*0.8)*factor;
        const armCirc = (womenBaseEU.armCirc + diff*0.8)*factor;
        const cuffCirc = (womenBaseEU.cuffCirc + diff*0.6)*factor;
        const neckCirc = (womenBaseEU.neckCirc + diff*0.8)*factor;
        const waistToHip = (womenBaseEU.waistToHip + diff*0.2)*factor;
        const waistToKnee = (womenBaseEU.waistToKnee + diff*0.8)*factor;
        const legLength = (womenBaseEU.legLength + diff*1.2)*factor;
        const skirtLength = (womenBaseEU.skirtLength + diff*0.8)*factor;
        const chestLength = (womenBaseEU.chestLength + diff*0.8)*factor;
        const armholeCirc = (womenBaseEU.armholeCirc + diff*1.2)*factor;
        const waistToArmpit = (womenBaseEU.waistToArmpit + diff*0.5)*factor;
        const shoulderToBust = (womenBaseEU.shoulderToBust + diff*0.3)*factor;
        const bustPointDist = (womenBaseEU.bustPointDist + diff*0.2)*factor;
        const inlegLength = (womenBaseEU.inlegLength + diff*0.8)*factor;

    function getMenMeasurements(system, size) {
        let eu = menSizeToEU(system, size);
        let diff = (eu-48)/2;
        let factor = system==='asian'?0.97:(system==='arab'?1.02:1);
        const chest = (menBaseEU.chest + diff*4)*factor;
        const waist = (menBaseEU.waist + diff*4)*factor;
        const hip = (menBaseEU.hip + diff*4)*factor;
        const backWidth = (menBaseEU.backWidth + diff*1.2)*factor;
        const shoulderLength = (menBaseEU.shoulderLength + diff*0.3)*factor;
        const backLength = (menBaseEU.backLength + diff*0.8)*factor;
        const sleeveLength = (menBaseEU.sleeveLength + diff*0.8)*factor;
        const armCirc = (menBaseEU.armCirc + diff*0.8)*factor;
        const cuffCirc = (menBaseEU.cuffCirc + diff*0.6)*factor;
        const neckCirc = (menBaseEU.neckCirc + diff*0.8)*factor;
        const waistToHip = (menBaseEU.waistToHip + diff*0.2)*factor;
        const waistToKnee = (menBaseEU.waistToKnee + diff*0.8)*factor;
        const legLength = (menBaseEU.legLength + diff*1.2)*factor;
        const pantsLength = (menBaseEU.pantsLength + diff*0.8)*factor;
        const chestLength = (menBaseEU.chestLength + diff*0.8)*factor;
        const armholeCirc = (menBaseEU.armholeCirc + diff*1.2)*factor;
        const waistToArmpit = (menBaseEU.waistToArmpit + diff*0.5)*factor;
        const shoulderToChest = (menBaseEU.shoulderToChest + diff*0.3)*factor;
        const chestPointDist = (menBaseEU.chestPointDist + diff*0.2)*factor;
        const inlegLength = (menBaseEU.inlegLength + diff*0.8)*factor;
        return { chest,waist,hip,backWidth,shoulderLength,backLength,sleeveLength,armCirc,cuffCirc,neckCirc,waistToHip,waistToKnee,legLength,pantsLength,chestLength,armholeCirc,waistToArmpit,shoulderToChest,chestPointDist,inlegLength };
    }
    function getInfantMeasurements(system, month) {
        let meas = infantBase[month] || infantBase[6];
        let factor = 1;
        if (system === 'asian') factor = 0.96;
        if (system === 'arab') factor = 1.02;
        let scaled = {};
        for (let k in meas) scaled[k] = meas[k] * factor;
        return scaled;
    }
    function getKidsMeasurements(system, age) {
        let meas = kidsData[age] || kidsData[6];
        let factor = 1;
        if (system === 'asian') factor = 0.96;
        if (system === 'arab') factor = 1.02;
        let scaled = {};
        for (let k in meas) scaled[k] = meas[k] * factor;
        return scaled;
    }

    // حساب مقاسات الباترون الأساسي (ربع الباترون)
    function calculatePatternMeasurements(meas, type) {
        const chest = meas.chest;
        const waist = meas.waist;
        const hip = meas.hip;
        const neck = meas.neckCirc;
        const backLength = meas.backLength;
        const shoulder = meas.shoulderLength;
        const waistToHip = meas.waistToHip;
        const legLength = meas.legLength;
        const sleeveLength = meas.sleeveLength;
        const armCirc = meas.armCirc;
        const cuffCirc = meas.cuffCirc;
        const waistToKnee = meas.waistToKnee;
        const bustDist = type==='women'?meas.bustPointDist:(type==='men'?meas.chestPointDist:meas.bustPointDist);
        const shoulderToBust = type==='women'?meas.shoulderToBust:(type==='men'?meas.shoulderToChest:meas.shoulderToBust);

        const neckWidth = (neck/6)+0.5;
        const frontNeckDrop = neck/5;
        const backNeckDrop = neck/20;
        const armholeDepth = (chest/4)-2;
        const chestQuarter = chest/4;
        const backWidthPat = chestQuarter-2;
        const waistQuarter = waist/4;
        const hipQuarter = hip/4;
        const hipHeight = waistToHip;
        const totalLength = legLength;
        const thighCirc = chest*0.55;
        const crotchHeight = legLength/4;
        const frontCrotch = waist/8;
        const backCrotch = waist/6;
        const skirtToKnee = waistToKnee;
        const sleeveWidth = (chest/5)+3;
        const sleeveCapHeight = armholeDepth*0.8;
        const cuffWidth = cuffCirc;
        const shoulderSlope = 4;
        const backNeckDepth = backNeckDrop+1;

        return {
            "طول الظهر": { value: backLength, numericFormula: `${backLength.toFixed(1)}` },
            "عرض الكتف": { value: shoulder, numericFormula: `${shoulder.toFixed(1)}` },
            "عرض حردة الرقبة": { value: neckWidth, numericFormula: `(${neck.toFixed(1)} ÷ 6) + 0.5 = ${neckWidth.toFixed(1)}` },
            "نزول الرقبة الأمامية": { value: frontNeckDrop, numericFormula: `${neck.toFixed(1)} ÷ 5 = ${frontNeckDrop.toFixed(1)}` },
            "نزول الرقبة الخلفية": { value: backNeckDrop, numericFormula: `${neck.toFixed(1)} ÷ 20 = ${backNeckDrop.toFixed(1)}` },
            "ارتفاع حفرة الجيرو": { value: armholeDepth, numericFormula: `(${chest.toFixed(1)} ÷ 4) - 2 = ${armholeDepth.toFixed(1)}` },
            "عرض الصدر ÷ 4": { value: chestQuarter, numericFormula: `${chest.toFixed(1)} ÷ 4 = ${chestQuarter.toFixed(1)}` },
            "عرض الظهر (الباترون)": { value: backWidthPat, numericFormula: `(${chest.toFixed(1)} ÷ 4) - 2 = ${backWidthPat.toFixed(1)}` },
            "عرض الخصر ÷ 4": { value: waistQuarter, numericFormula: `${waist.toFixed(1)} ÷ 4 = ${waistQuarter.toFixed(1)}` },
            "عرض الورك ÷ 4": { value: hipQuarter, numericFormula: `${hip.toFixed(1)} ÷ 4 = ${hipQuarter.toFixed(1)}` },
            "ارتفاع الورك (من الخصر)": { value: hipHeight, numericFormula: `${hipHeight.toFixed(1)}` },
            "طول البنطلون/التنورة": { value: totalLength, numericFormula: `${totalLength.toFixed(1)}` },
            "محيط الفخذ": { value: thighCirc, numericFormula: `${chest.toFixed(1)} × 0.55 = ${thighCirc.toFixed(1)}` },
            "ارتفاع السرج": { value: crotchHeight, numericFormula: `${legLength.toFixed(1)} ÷ 4 = ${crotchHeight.toFixed(1)}` },
            "عرض خط السرج الأمامي": { value: frontCrotch, numericFormula: `${waist.toFixed(1)} ÷ 8 = ${frontCrotch.toFixed(1)}` },
            "عرض خط السرج الخلفي": { value: backCrotch, numericFormula: `${waist.toFixed(1)} ÷ 6 = ${backCrotch.toFixed(1)}` },
            "طول التنورة إلى الركبة": { value: skirtToKnee, numericFormula: `${skirtToKnee.toFixed(1)}` },
            "عرض الكم": { value: sleeveWidth, numericFormula: `(${chest.toFixed(1)} ÷ 5) + 3 = ${sleeveWidth.toFixed(1)}` },
            "طول الكم": { value: sleeveLength, numericFormula: `${sleeveLength.toFixed(1)}` },
            "ارتفاع رأس الكم": { value: sleeveCapHeight, numericFormula: `${armholeDepth.toFixed(1)} × 0.8 = ${sleeveCapHeight.toFixed(1)}` },
            "عرض الأسوارة": { value: cuffWidth, numericFormula: `${cuffWidth.toFixed(1)}` },
            "ميل الكتف": { value: shoulderSlope, numericFormula: `${shoulderSlope}` },
            "المسافة بين الثديين/الحلمات": { value: bustDist, numericFormula: `${bustDist.toFixed(1)}` },
            "المسافة من الكتف إلى الصدر": { value: shoulderToBust, numericFormula: `${shoulderToBust.toFixed(1)}` },
            "عمق الرقبة الخلفية": { value: backNeckDepth, numericFormula: `${backNeckDrop.toFixed(1)} + 1 = ${backNeckDepth.toFixed(1)}` }
        };
    }

    }

        if(currentGender === 'women') return getWomenMeasurements(currentSystem, currentSize);

    function showRuleModal(ruleText, numericFormula) {
        if(activeModal) activeModal.remove();
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const modal = document.createElement('div');
        modal.className = 'modal-content';
        modal.innerHTML = `
            <div class="close-modal"><i class="fas fa-times"></i></div>
            <div class="rule-text"><strong>${translations[currentLang].ruleText}</strong> ${ruleText}</div>
            <div class="formula-numbers"><strong>${translations[currentLang].formulaNumbers || 'المعادلة بالأرقام:'}</strong><br>${numericFormula}</div>
        `;
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        activeModal = overlay;
        modal.querySelector('.close-modal').addEventListener('click', () => {
            overlay.remove();
            activeModal = null;
        });
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) {
                overlay.remove();
                activeModal = null;
            }
        });
    }

    function renderTables() {
        const measurements = getMeasurementsObject();
        const measValues = [
            measurements.backWidth, measurements.shoulderLength, measurements.backLength, measurements.sleeveLength,
            measurements.armCirc, measurements.cuffCirc, measurements.neckCirc, measurements.chest, measurements.waist,
            measurements.hip, measurements.waistToHip, measurements.waistToKnee, measurements.legLength,
            (currentGender === 'women' ? measurements.skirtLength : (currentGender === 'men' ? measurements.pantsLength : (currentGender === 'kids' ? measurements.skirtLength : measurements.skirtLength))),
            measurements.chestLength, measurements.armholeCirc, measurements.waistToArmpit,
            (currentGender === 'women' ? measurements.shoulderToBust : (currentGender === 'men' ? measurements.shoulderToChest : measurements.shoulderToBust)),
            (currentGender === 'women' ? measurements.bustPointDist : (currentGender === 'men' ? measurements.chestPointDist : measurements.bustPointDist))
        ];
        const pattern = calculatePatternMeasurements(measurements, currentGender);
        const t = translations[currentLang];
        const unitSymbol = currentUnit === 'cm' ? t.unitCm : t.unitIn;
        const measurementNamesLocal = measurementTranslations[currentLang] || measurementTranslations.ar;

        const bodyTableHtml = `
            <div class="card">

                    <table>

                        <tbody>
                            ${measurementNamesLocal.map((name,i) => `<tr><td>${name}</td><td><strong>${formatDim(measValues[i])}</strong></td></tr>`).join('')}

                    </table>

            <div class="card">
                <div class="card-header">${t.patternTableTitle}</div>

                    <table>
                        <thead><tr><th>${t.measurement}</th><th>${t.value} (${unitSymbol})</th><th>${t.explanation}</th></tr></thead>
                        <tbody>
                            ${Object.entries(pattern).map(([key, {value, numericFormula}]) => {
                                const ruleText = ruleExplanations[key] || key;
                                return `<tr>
                                    <td>${key}</td>
                                    <td><strong>${formatDim(value)}</strong></td>
                                    <td><button class="info-btn" data-rule="${ruleText.replace(/"/g, '&quot;')}" data-formula="${numericFormula.replace(/"/g, '&quot;')}"><i class="fas fa-info-circle"></i></button></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        document.querySelectorAll('.info-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const rule = btn.getAttribute('data-rule');
                const formula = btn.getAttribute('data-formula');
                showRuleModal(rule, formula);
            });
        });
    }

        container.innerHTML = sizes.map(s => `<button class="btn ${s === currentSize ? 'active' : ''}" data-size="${s}">${s} ${suffix}</button>`).join('');

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('app-title').innerText = t.appTitle;
        document.getElementById('system-label').innerText = t.systemLabel;
        document.getElementById('gender-label').innerText = t.genderLabel;
        document.getElementById('unit-label').innerText = t.unitLabel;
        document.getElementById('size-label').innerText = t.sizeLabel;
        document.getElementById('export-text').innerText = `تصدير Excel (${t.bodyTableTitle} + ${t.patternTableTitle})`;
        document.getElementById('footer-text').innerHTML = t.footer;
        document.querySelector('#gender-buttons button[data-gender="women"]').innerText = t.women;
        document.querySelector('#gender-buttons button[data-gender="men"]').innerText = t.men;
        document.querySelector('#gender-buttons button[data-gender="kids"]').innerText = t.kids;
        document.querySelector('#gender-buttons button[data-gender="infant"]').innerText = t.infant;

    if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
    document.getElementById('theme-toggle').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    });

    document.getElementById('lang-select').addEventListener('change', (e) => {
