<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>موسوعة الأجيال – مدارس رسم الباترون العالمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        :root {
            --primary: #2c5282;
            --primary-light: #4299c1;
            --secondary: #48bb78;
            --accent: #ed8936;
            --gray-light: #f7fafc;
            --gray: #cbd5e0;
            --dark: #2d3748;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
            --bg-page: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #cbd5e0;
        }
        body.dark {
            --primary: #4299c1;
            --primary-light: #63b3ed;
            --secondary: #68d391;
            --accent: #f6ad55;
            --gray-light: #2d3748;
            --gray: #4a5568;
            --dark: #f7fafc;
            --white: #1a202c;
            --bg-page: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --border-color: #4a5568;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-page);
            color: var(--text-color);
            direction: rtl;
            padding: 1rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .lang-select, .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            color: white;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .theme-toggle {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .selection-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            min-width: 160px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--white);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .btn.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }
        .size-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 160px;
            overflow-y: auto;
            padding: 0.5rem;
            background: var(--gray-light);
            border-radius: 10px;
            margin-top: 0.5rem;
        }
        .size-option {
            padding: 0.3rem 0.8rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .size-option.selected {
            background: var(--primary);
            color: white;
        }
        .tables-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .card-header {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-content {
            padding: 1rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 0.5rem 0.3rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: var(--gray-light);
            color: var(--primary);
        }
        .info-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--accent);
        }
        .formula-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem;
            max-width: 300px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            direction: rtl;
        }
        .pattern-canvas-container {
            background: #fafafa;
            padding: 1rem;
            text-align: center;
            overflow-x: auto;
        }
        canvas {
            background: white;
            box-shadow: var(--shadow);
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .instructions-card {
            margin-top: 1rem;
        }
        .instructions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .method-select {
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            background: var(--white);
            font-family: 'Tajawal', sans-serif;
        }
        .instructions-content {
            padding: 1rem;
            line-height: 1.6;
            font-size: 0.9rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .instructions-content h4 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .instructions-content h5 {
            margin-top: 0.8rem;
            margin-bottom: 0.3rem;
            color: var(--accent);
        }
        .instructions-content ul, .instructions-content ol {
            margin-right: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .instructions-content li {
            margin-bottom: 0.3rem;
        }
        .instructions-content hr {
            margin: 0.5rem 0;
        }
        .export-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .export-btn {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .footer {
            text-align: center;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--gray);
        }
        @media (max-width: 768px) {
            .tables-container {
                grid-template-columns: 1fr;
            }
            .instructions-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-drafting-compass"></i> <span id="app-title">موسوعة الأجيال – مدارس رسم الباترون العالمية</span></h1>
        <div class="header-controls">
            <select id="lang-select" class="lang-select">

            <button id="theme-toggle" class="theme-toggle"><i class="fas fa-moon"></i></button>

    </div>

    <div class="selection-card">
        <div class="row">
            <div class="form-group">
                <label id="system-label">نظام المقاسات</label>
                <select id="size-system">
                    <option value="eu">🇪🇺 EU</option>
                    <option value="us">🇺🇸 US</option>
                    <option value="arab">🇸🇦 Arab</option>
                    <option value="asian">🇯🇵 Asian</option>
                </select>
            </div>
            <div class="form-group">
                <label id="gender-label">الجنس</label>
                <div class="btn-group" id="gender-buttons">
                    <button class="btn active" data-gender="women">نساء</button>
                    <button class="btn" data-gender="men">رجال</button>
                    <button class="btn" data-gender="kids">أطفال</button>
                    <button class="btn" data-gender="infant">رضع</button>
                </div>
            </div>
            <div class="form-group">
                <label id="unit-label">الوحدة</label>
                <div class="btn-group" id="unit-buttons">
                    <button class="btn active" data-unit="cm">سم</button>
                    <button class="btn" data-unit="in">إنش</button>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label id="size-number-label">رقم المقاس</label>
            <div id="size-buttons-container" class="size-buttons"></div>
        </div>
        <div class="row" id="calculation-methods">
            <!-- خيارات طريقة الحساب (ستبقى للتحكم في الصيغة/القياس المباشر) -->
        </div>
        <div class="form-group">
            <label id="school-label">مدرسة الرسم</label>
            <select id="school-select">
                <option value="german">🇩🇪 الألمانية (M. Müller & Sohn)</option>
                <option value="italian">🇮🇹 الإيطالية (Sartorial)</option>
                <option value="french">🇫🇷 الفرنسية (ESMOD)</option>
                <option value="american">🇺🇸 الأمريكية (Armstrong)</option>
                <option value="flat">📐 المسطح (Flat / للمبتدئين)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="sleeve-type-label">نوع الكم</label>
            <select id="sleeve-type">
                <option value="basic">أساسي (قطعة واحدة)</option>
                <option value="twopiece">تايلور (قطعتين)</option>
                <option value="raglan">ريكلان (راجلان)</option>
            </select>
        </div>
    </div>

    <div id="tables-container" class="tables-container"></div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-drafting-compass"></i> <span id="pattern-title">رسم الباترون الأساسي</span>
        </div>
        <div class="pattern-canvas-container">
            <canvas id="patternCanvas" width="800" height="600" style="max-width:100%; height:auto;"></canvas>
        </div>
        <div class="export-buttons">
            <button class="export-btn" id="export-pdf"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="export-btn" id="export-png"><i class="fas fa-image"></i> PNG</button>
            <button class="export-btn" id="export-excel"><i class="fas fa-file-excel"></i> Excel</button>
        </div>
    </div>

    <div class="card instructions-card">
        <div class="card-header instructions-header">
            <span><i class="fas fa-list-ol"></i> <span id="instructions-title">تعليمات رسم الباترون (حسب المدرسة)</span></span>
        </div>
        <div class="instructions-content" id="instructions-content">
            <!-- سيتم ملؤه ديناميكياً -->
        </div>
    </div>

    <div class="footer">
        <p id="footer-text">جميع الحسابات وفق المدارس العالمية – اضغط على أيقونة ℹ️ لرؤية القاعدة والمعادلة</p>
    </div>
</div>

<script>
    // ======================== الترجمة (مختصرة) ========================
    const translations = {
        ar: {
            appTitle: "موسوعة الأجيال – مدارس رسم الباترون العالمية",
            systemLabel: "نظام المقاسات", genderLabel: "الجنس", unitLabel: "الوحدة",
            sizeNumberLabel: "رقم المقاس", bodyTableTitle: "المقاسات التفصيلية (19 قياساً)",
            patternTableTitle: "مقاسات الباترون الأساسي (ربع الباترون)",
            measurement: "القياس", value: "القيمة", explanation: "الشرح", formula: "القاعدة",
            patternTitle: "رسم الباترون الأساسي", instructionsTitle: "تعليمات رسم الباترون (حسب المدرسة)",
            footer: "جميع الحسابات وفق المدارس العالمية – اضغط على ℹ️ لرؤية القاعدة والمعادلة",
            unitCm: "سم", unitIn: "إنش", methodLabel: "طريقة حساب", direct: "قياس مباشر",
            formula: "معادلة", armholeDepthMethod: "ارتفاع حفرة الإبط", neckDropMethod: "نزول الرقبة الأمامية",
            backNeckDropMethod: "نزول الرقبة الخلفية", shoulderSlopeMethod: "ميل الكتف",
            sleeveTypeLabel: "نوع الكم", schoolLabel: "مدرسة الرسم"
        },
        en: { /* ... اختصاراً نأخذ العربية كأساس */ }
    };

    // بيانات المقاسات (نفس السابق)
    const womenSizes = {
        34: { chest: 88, waist: 69, hip: 94, backWidth: 35, shoulderLength: 12.7, backLength: 38.5, sleeveLength: 57, armCirc: 27.5, cuffCirc: 16, neckCirc: 36, waistToHip: 18, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 43, armholeCirc: 42, waistToArmpit: 28, shoulderToBust: 24, bustPointDist: 18, armholeDepth: 20.5 },
        36: { chest: 92, waist: 73, hip: 98, backWidth: 36, shoulderLength: 13, backLength: 39, sleeveLength: 57, armCirc: 28.5, cuffCirc: 16.5, neckCirc: 37, waistToHip: 18.5, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 44, armholeCirc: 43, waistToArmpit: 28.5, shoulderToBust: 24.5, bustPointDist: 18.5, armholeDepth: 21 },
        38: { chest: 96, waist: 77, hip: 102, backWidth: 37, shoulderLength: 13.3, backLength: 39.5, sleeveLength: 57, armCirc: 29.5, cuffCirc: 17, neckCirc: 38, waistToHip: 19, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 45, armholeCirc: 44, waistToArmpit: 29, shoulderToBust: 25, bustPointDist: 19, armholeDepth: 21.5 },
        40: { chest: 100, waist: 81, hip: 106, backWidth: 38, shoulderLength: 13.6, backLength: 40, sleeveLength: 57, armCirc: 30.5, cuffCirc: 17.5, neckCirc: 39, waistToHip: 19.5, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 46, armholeCirc: 45, waistToArmpit: 29.5, shoulderToBust: 25.5, bustPointDist: 19.5, armholeDepth: 22 },
        42: { chest: 104, waist: 85, hip: 110, backWidth: 39, shoulderLength: 13.9, backLength: 40.5, sleeveLength: 57, armCirc: 31.5, cuffCirc: 18, neckCirc: 40, waistToHip: 20, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 47, armholeCirc: 46, waistToArmpit: 30, shoulderToBust: 26, bustPointDist: 20, armholeDepth: 22.5 },
        44: { chest: 108, waist: 89, hip: 114, backWidth: 40, shoulderLength: 14.2, backLength: 41, sleeveLength: 57, armCirc: 32.5, cuffCirc: 18.5, neckCirc: 41, waistToHip: 20.5, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 48, armholeCirc: 47, waistToArmpit: 30.5, shoulderToBust: 26.5, bustPointDist: 20.5, armholeDepth: 23 },
        46: { chest: 112, waist: 93, hip: 118, backWidth: 41, shoulderLength: 14.5, backLength: 41.5, sleeveLength: 57, armCirc: 33.5, cuffCirc: 19, neckCirc: 42, waistToHip: 21, waistToKnee: 58, legLength: 100, skirtLength: 60, chestLength: 49, armholeCirc: 48, waistToArmpit: 31, shoulderToBust: 27, bustPointDist: 21, armholeDepth: 23.5 }
    };
    const menSizes = {
        38: { chest: 88, waist: 76, hip: 92, backWidth: 35, shoulderLength: 14, backLength: 42, sleeveLength: 60, armCirc: 30, cuffCirc: 18, neckCirc: 38, waistToHip: 20, waistToKnee: 60, legLength: 106, pantsLength: 102, chestLength: 44, armholeCirc: 42, waistToArmpit: 30, shoulderToChest: 25, chestPointDist: 18, armholeDepth: 20 },
        40: { chest: 92, waist: 80, hip: 96, backWidth: 36, shoulderLength: 14.3, backLength: 42.5, sleeveLength: 60, armCirc: 31, cuffCirc: 18.5, neckCirc: 39, waistToHip: 20.5, waistToKnee: 60, legLength: 106, pantsLength: 102, chestLength: 44.5, armholeCirc: 43, waistToArmpit: 30.5, shoulderToChest: 25.5, chestPointDist: 18.5, armholeDepth: 20.5 }
    };
    const kidsSizes = { 2: { chest: 53, waist: 51, hip: 56, backWidth: 24, shoulderLength: 8, backLength: 22, sleeveLength: 32, armCirc: 18, cuffCirc: 14, neckCirc: 26, waistToHip: 12, waistToKnee: 32, legLength: 86, skirtLength: 34, chestLength: 23, armholeCirc: 28, waistToArmpit: 16, shoulderToBust: 14, bustPointDist: 10, armholeDepth: 14 } };
    const infantSizes = { 6: { chest: 44, waist: 42, hip: 44, backWidth: 10, shoulderLength: 7.5, backLength: 24, sleeveLength: 26, armCirc: 18, cuffCirc: 15, neckCirc: 30, waistToHip: 10.5, waistToKnee: 30, legLength: 58, skirtLength: 32, chestLength: 22, armholeCirc: 31, waistToArmpit: 17, shoulderToBust: 10.5, bustPointDist: 8.5, armholeDepth: 15.5 } };

    function getMeasurements() {
        let sizeData;
        if (currentGender === 'women') sizeData = womenSizes[currentSize] || womenSizes[38];
        else if (currentGender === 'men') sizeData = menSizes[currentSize] || menSizes[48];
        else if (currentGender === 'kids') sizeData = kidsSizes[currentSize] || kidsSizes[6];
        else sizeData = infantSizes[currentSize] || infantSizes[6];
        return sizeData;
    }

    let currentGender = 'women', currentSystem = 'eu', currentSize = 38, currentUnit = 'cm', currentLang = 'ar';
    let currentSleeveType = 'basic';
    let currentSchool = 'german';   // مدرسة الرسم: german, italian, french, american, flat
    let currentMethods = { armholeDepth: 'formula', frontNeckDrop: 'formula', backNeckDrop: 'formula', shoulderSlope: 'formula' };

    function formatDim(v) { return currentUnit === 'in' ? (v/2.54).toFixed(2)+' in' : v.toFixed(1)+' سم'; }

    // ========== حساب قيم الباترون حسب المدرسة ==========
    function computeSchoolValues(meas) {
        const chest = meas.chest, waist = meas.waist, neck = meas.neckCirc, backLen = meas.backLength;
        let neckWidth, armholeDepth, frontNeckDrop, backNeckDrop, shoulderSlope, patternWidth, patternHeight;
        switch(currentSchool) {
            case 'german': // ألماني (Müller & Sohn)
                neckWidth = (chest / 20) + 2;
                armholeDepth = (chest / 10) + 10.5;
                frontNeckDrop = neck / 5;       // نزول الرقبة الأمامية (معادلة تقريبية)
                backNeckDrop = 2;
                shoulderSlope = 4.5;
                break;
            case 'italian': // إيطالي (Sartorial)
                neckWidth = neck / 6;
                armholeDepth = (chest / 4) - 2;
                frontNeckDrop = neck / 5;
                backNeckDrop = 2;
                shoulderSlope = 4; // خلف 4، أمام 5 لكن نأخذ متوسط
                break;
            case 'french': // فرنسي (ESMOD)
                neckWidth = (neck / 24) + 1.7;  // تقريب
                armholeDepth = backLen / 2;
                frontNeckDrop = neck / 5;
                backNeckDrop = 1.8;
                shoulderSlope = 4.8;
                break;
            case 'american': // أمريكي (Armstrong)
                neckWidth = (neck / 6) + 0.5;
                armholeDepth = (chest / 4) - 1.5;
                frontNeckDrop = neck / 5;
                backNeckDrop = 2;
                shoulderSlope = 4.2;
                break;
            default: // flat (المسطح)
                neckWidth = 7.5;            // عرض ثابت تقريبي
                armholeDepth = 19;           // ثابت للمقاسات المتوسطة
                frontNeckDrop = 8;
                backNeckDrop = 2;
                shoulderSlope = 3;
        }
        // إذا كان المستخدم اختار "قياس مباشر" نعطي الأولوية للقياس الموجود
        if (currentMethods.armholeDepth === 'direct' && meas.armholeDepth) armholeDepth = meas.armholeDepth;
        if (currentMethods.frontNeckDrop === 'direct' && meas.frontNeckDrop) frontNeckDrop = meas.frontNeckDrop;
        if (currentMethods.backNeckDrop === 'direct' && meas.backNeckDrop) backNeckDrop = meas.backNeckDrop;
        if (currentMethods.shoulderSlope === 'direct' && meas.shoulderSlope) shoulderSlope = meas.shoulderSlope;

        patternWidth = (chest/2) + 3;
        patternHeight = backLen + 1.5;

        return { neckWidth, armholeDepth, frontNeckDrop, backNeckDrop, shoulderSlope, patternWidth, patternHeight };
    }

    function computePattern(meas) {
        const school = computeSchoolValues(meas);
        const chest = meas.chest, waist = meas.waist, hip = meas.hip, neck = meas.neckCirc;
        const backLength = meas.backLength, shoulder = meas.shoulderLength, waistToHip = meas.waistToHip;
        const legLength = meas.legLength, sleeveLength = meas.sleeveLength, armCirc = meas.armCirc;
        const cuffCirc = meas.cuffCirc, waistToKnee = meas.waistToKnee, bustDist = meas.bustPointDist;
        const shoulderToBust = meas.shoulderToBust;

        const chestQuarter = chest / 4;
        const backWidthPat = chestQuarter - 2;
        const waistQuarter = waist / 4;
        const hipQuarter = hip / 4;
        const thighCirc = chest * 0.55;
        const crotchHeight = legLength / 4;
        const frontCrotch = waist / 8;
        const backCrotch = waist / 6;
        const sleeveWidth = (chest / 5) + 3;
        const sleeveCapHeight = school.armholeDepth * 0.8;
        const backNeckDepth = school.backNeckDrop + 1;

        return {
            "طول الظهر": { value: backLength, numericFormula: `${backLength.toFixed(1)}` },
            "عرض الكتف": { value: shoulder, numericFormula: `${shoulder.toFixed(1)}` },
            "عرض حردة الرقبة": { value: school.neckWidth, numericFormula: `حسب المدرسة` },
            "نزول الرقبة الأمامية": { value: school.frontNeckDrop, numericFormula: `حسب المدرسة` },
            "نزول الرقبة الخلفية": { value: school.backNeckDrop, numericFormula: `حسب المدرسة` },
            "ارتفاع حفرة الجيرو": { value: school.armholeDepth, numericFormula: `حسب المدرسة` },
            "عرض الصدر ÷ 4": { value: chestQuarter, numericFormula: `${chest.toFixed(1)} ÷ 4 = ${chestQuarter.toFixed(1)}` },
            "عرض الظهر (الباترون)": { value: backWidthPat, numericFormula: `(${chest.toFixed(1)} ÷ 4) - 2 = ${backWidthPat.toFixed(1)}` },
            "عرض الخصر ÷ 4": { value: waistQuarter, numericFormula: `${waist.toFixed(1)} ÷ 4 = ${waistQuarter.toFixed(1)}` },
            "عرض الورك ÷ 4": { value: hipQuarter, numericFormula: `${hip.toFixed(1)} ÷ 4 = ${hipQuarter.toFixed(1)}` },
            "ارتفاع الورك (من الخصر)": { value: waistToHip, numericFormula: `${waistToHip.toFixed(1)}` },
            "طول البنطلون/التنورة": { value: legLength, numericFormula: `${legLength.toFixed(1)}` },
            "محيط الفخذ": { value: thighCirc, numericFormula: `${chest.toFixed(1)} × 0.55 = ${thighCirc.toFixed(1)}` },
            "ارتفاع السرج": { value: crotchHeight, numericFormula: `${legLength.toFixed(1)} ÷ 4 = ${crotchHeight.toFixed(1)}` },
            "عرض خط السرج الأمامي": { value: frontCrotch, numericFormula: `${waist.toFixed(1)} ÷ 8 = ${frontCrotch.toFixed(1)}` },
            "عرض خط السرج الخلفي": { value: backCrotch, numericFormula: `${waist.toFixed(1)} ÷ 6 = ${backCrotch.toFixed(1)}` },
            "طول التنورة إلى الركبة": { value: waistToKnee, numericFormula: `${waistToKnee.toFixed(1)}` },
            "عرض الكم": { value: sleeveWidth, numericFormula: `(${chest.toFixed(1)} ÷ 5) + 3 = ${sleeveWidth.toFixed(1)}` },
            "طول الكم": { value: sleeveLength, numericFormula: `${sleeveLength.toFixed(1)}` },
            "ارتفاع رأس الكم": { value: sleeveCapHeight, numericFormula: `${school.armholeDepth.toFixed(1)} × 0.8 = ${sleeveCapHeight.toFixed(1)}` },
            "عرض الأسوارة": { value: cuffCirc, numericFormula: `${cuffCirc.toFixed(1)}` },
            "ميل الكتف": { value: school.shoulderSlope, numericFormula: `${school.shoulderSlope}` },
            "المسافة بين الثديين/الحلمات": { value: bustDist, numericFormula: `${bustDist.toFixed(1)}` },
            "المسافة من الكتف إلى الصدر": { value: shoulderToBust, numericFormula: `${shoulderToBust.toFixed(1)}` },
            "عمق الرقبة الخلفية": { value: backNeckDepth, numericFormula: `${school.backNeckDrop.toFixed(1)} + 1 = ${backNeckDepth.toFixed(1)}` }
        };
    }

    function drawPattern(meas) {
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.save();

        const school = computeSchoolValues(meas);
        const chest = meas.chest, backLength = meas.backLength, neck = meas.neckCirc;
        const neckWidth = school.neckWidth;
        const armholeDepth = school.armholeDepth;
        const frontNeckDrop = school.frontNeckDrop;
        const shoulderSlope = school.shoulderSlope;
        const waistToHip = meas.waistToHip;
        const width = (chest/2)+3;
        const height = backLength+1.5;

        const scale = Math.min((w-100)/width, (h-100)/height, 3.2);
        const offX=50, offY=50;
        const rectW=width*scale, rectH=height*scale;

        ctx.strokeStyle='#2c5282'; ctx.lineWidth=1.5;
        ctx.strokeRect(offX,offY,rectW,rectH);
        ctx.fillStyle='rgba(44,82,130,0.05)'; ctx.fillRect(offX,offY,rectW,rectH);

        const midX=offX+rectW/2;
        ctx.beginPath(); ctx.moveTo(midX,offY); ctx.lineTo(midX,offY+rectH);
        ctx.strokeStyle='#000'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);

        const chestY=offY+armholeDepth*scale;
        ctx.beginPath(); ctx.moveTo(offX,chestY); ctx.lineTo(offX+rectW,chestY);
        ctx.strokeStyle='#e53e3e'; ctx.setLineDash([5,5]); ctx.stroke();

        const waistY=offY+backLength*scale;
        ctx.beginPath(); ctx.moveTo(offX,waistY); ctx.lineTo(offX+rectW,waistY); ctx.stroke();

        const hipY=offY+(backLength-waistToHip)*scale;
        ctx.beginPath(); ctx.moveTo(offX,hipY); ctx.lineTo(offX+rectW,hipY); ctx.stroke();
        ctx.setLineDash([]);

        const neckTopX=offX+neckWidth*scale;
        const neckDropX=offX+rectW/2;
        const neckDropY=offY+frontNeckDrop*scale;
        ctx.beginPath(); ctx.moveTo(neckTopX,offY);
        ctx.quadraticCurveTo(offX+rectW/2,offY, neckDropX,neckDropY);
        ctx.stroke();

        const shoulderEndX=offX+(shoulderSlope+2)*scale;
        const shoulderEndY=offY+shoulderSlope*scale;
        ctx.beginPath(); ctx.moveTo(neckTopX,offY); ctx.lineTo(shoulderEndX,shoulderEndY); ctx.stroke();

        ctx.fillStyle='#e53e3e'; ctx.font="12px 'Tajawal'";
        ctx.fillText(`عرض: ${formatDim(width)}`, offX+rectW/2, offY-5);
        ctx.fillText(`طول: ${formatDim(height)}`, offX+rectW+5, offY+rectH/2);
        ctx.fillText(`خط الصدر: ${formatDim(armholeDepth)}`, offX+rectW+5, chestY);
        ctx.fillText(`خط الخصر: ${formatDim(backLength)}`, offX+rectW+5, waistY);
        ctx.fillText(`خط الورك: ${formatDim(waistToHip)}`, offX+rectW+5, hipY);
        ctx.fillStyle='#1e3c72'; ctx.font="bold 14px 'Tajawal'";
        ctx.fillText(`ربع الباترون - المدرسة ${schoolName()}`, offX, offY-15);
        ctx.restore();
    }

    function schoolName() {
        const map = { german:'الألمانية', italian:'الإيطالية', french:'الفرنسية', american:'الأمريكية', flat:'المسطح' };
        return map[currentSchool];
    }

    function generateInstructions(meas) {
        const school = computeSchoolValues(meas);
        const chest = meas.chest, neck = meas.neckCirc, backLength = meas.backLength;
        let html = `<div style="direction:rtl;"><h4>📘 طريقة رسم الباترون – المدرسة ${schoolName()}</h4>`;
        html += `<p><strong>المقاسات:</strong> محيط الصدر ${formatDim(chest)}، محيط الخصر ${formatDim(meas.waist)}، محيط الورك ${formatDim(meas.hip)}، طول الظهر ${formatDim(backLength)}</p><hr>`;
        switch(currentSchool) {
            case 'german':
                html += `<h5>✏️ القواعد الألمانية (M. Müller & Sohn)</h5>
                <ul><li>عرض حردة الرقبة = (محيط الصدر ÷ 20) + 2 = ${formatDim(school.neckWidth)}</li>
                <li>عمق حفرة الإبط = (محيط الصدر ÷ 10) + 10.5 = ${formatDim(school.armholeDepth)}</li>
                <li>نزول الرقبة الأمامية = محيط الرقبة ÷ 5 = ${formatDim(school.frontNeckDrop)}</li>
                <li>ميل الكتف = 4.5 سم (معتدل)</li>
                <li>يرسم المستطيل بعرض = (نصف الصدر + 3) = ${formatDim(school.patternWidth)}، وارتفاع = طول الظهر + 1.5 = ${formatDim(school.patternHeight)}</li>
                <li>يتم تحديد نقطتي الرقبة (أمام وخلف) ثم رسم خطوط الكتف وحفرة الإبط بمنحنيات دقيقة.</li></ul>`;
                break;
            case 'italian':
                html += `<h5>✏️ القواعد الإيطالية (Sartorial)</h5>
                <ul><li>عرض حردة الرقبة = محيط الرقبة ÷ 6 = ${formatDim(school.neckWidth)}</li>
                <li>عمق حفرة الإبط = (محيط الصدر ÷ 4) - 2 = ${formatDim(school.armholeDepth)}</li>
                <li>نزول الرقبة الأمامية = محيط الرقبة ÷ 5 = ${formatDim(school.frontNeckDrop)}</li>
                <li>ميل الكتف = 4 سم (يعدل حسب الجسم)</li>
                <li>يتم بناء المستطيل وتحديد خطوط الصدر والخصر والورك مع دقة عالية في توزيع البنسات.</li></ul>`;
                break;
            case 'french':
                html += `<h5>✏️ القواعد الفرنسية (ESMOD)</h5>
                <ul><li>عرض حردة الرقبة = (محيط الرقبة ÷ 24) + 1.7 = ${formatDim(school.neckWidth)}</li>
                <li>عمق حفرة الإبط = طول الظهر ÷ 2 = ${formatDim(school.armholeDepth)}</li>
                <li>نزول الرقبة الأمامية = محيط الرقبة ÷ 5 = ${formatDim(school.frontNeckDrop)}</li>
                <li>ميل الكتف = 4.8 سم (للأناقة)</li>
                <li>حردة الإبط الأمامية تحفر أعمق 1 سم من الخلف لراحة الحركة.</li></ul>`;
                break;
            case 'american':
                html += `<h5>✏️ القواعد الأمريكية (Armstrong)</h5>
                <ul><li>عرض حردة الرقبة = (محيط الرقبة ÷ 6) + 0.5 = ${formatDim(school.neckWidth)}</li>
                <li>عمق حفرة الإبط = (محيط الصدر ÷ 4) - 1.5 = ${formatDim(school.armholeDepth)}</li>
                <li>نزول الرقبة الأمامية = محيط الرقبة ÷ 5 = ${formatDim(school.frontNeckDrop)}</li>
                <li>ميل الكتف = 4.2 سم</li>
                <li>يتم رسم الباترون بنظام الكتلة (Block) ويمكن نقل البنسات بسهولة.</li></ul>`;
                break;
            default:
                html += `<h5>✏️ الباترون المسطح (للمبتدئين)</h5>
                <ul><li>عرض حردة الرقبة = 7.5 سم (ثابت)</li>
                <li>عمق حفرة الإبط = 19 سم (ثابت للمقاس المتوسط)</li>
                <li>نزول الرقبة الأمامية = 8 سم ، الخلفية = 2 سم</li>
                <li>ميل الكتف = 3 سم</li>
                <li>يستخدم للبلوزات والعبايات الفضفاضة، ويركز على الخطوط الخارجية فقط.</li></ul>`;
        }
        html += `<h5>🧵 باقي الحسابات:</h5>
        <ul><li>عرض الصدر ÷ 4 = ${formatDim(meas.chest/4)}</li>
        <li>عرض الخصر ÷ 4 = ${formatDim(meas.waist/4)}</li>
        <li>عرض الورك ÷ 4 = ${formatDim(meas.hip/4)}</li>
        <li>ارتفاع الورك = ${formatDim(meas.waistToHip)}</li>
        <li>عرض الكم = (صدر ÷ 5) + 3 = ${formatDim((meas.chest/5)+3)}</li>
        <li>ارتفاع رأس الكم = ارتفاع حفرة الإبط × 0.8 = ${formatDim(school.armholeDepth*0.8)}</li>
        <li>طريقة رسم الكم حسب النوع المختار (${currentSleeveType==='basic'?'أساسي':currentSleeveType==='twopiece'?'تايلور':'ريكلان'})</li></ul>`;
        html += `</div>`;
        return html;
    }

    function renderTables() {
        const meas = getMeasurements();
        const pattern = computePattern(meas);
        const t = translations[currentLang];
        const measurementNamesLocal = [
            "عرض الظهر","طول الكتف","طول الظهر","طول الكم","محيط الذراع","محيط الأسوارة","محيط الرقبة",
            "محيط الصدر","محيط الخصر","محيط الورك","من الخصر إلى الورك","من الخصر إلى الركبة","طول الساق",
            "طول التنورة/البنطلون","طول الصدر","محيط الإبط","من الخصر إلى الإبط","من الكتف إلى الصدر","المسافة بين الثديين"
        ];
        const measValues = [
            meas.backWidth, meas.shoulderLength, meas.backLength, meas.sleeveLength, meas.armCirc, meas.cuffCirc,
            meas.neckCirc, meas.chest, meas.waist, meas.hip, meas.waistToHip, meas.waistToKnee, meas.legLength,
            (currentGender==='women'?meas.skirtLength:(currentGender==='men'?meas.pantsLength:meas.skirtLength)),
            meas.chestLength, meas.armholeCirc, meas.waistToArmpit,
            (currentGender==='women'?meas.shoulderToBust:(currentGender==='men'?meas.shoulderToChest:meas.shoulderToBust)),
            (currentGender==='women'?meas.bustPointDist:(currentGender==='men'?meas.chestPointDist:meas.bustPointDist))
        ];
        const bodyHtml = `<div class="card"><div class="card-header">${t.bodyTableTitle}</div><div class="card-content"><table><thead><tr><th>${t.measurement}</th><th>${t.value} (${currentUnit==='cm'?t.unitCm:t.unitIn})</th></tr></thead><tbody>${measurementNamesLocal.map((n,i)=>`<tr><td>${n}</td><td><strong>${formatDim(measValues[i])}</strong></td></tr>`).join('')}</tbody></table></div></div>`;
        const patternHtml = `<div class="card"><div class="card-header">${t.patternTableTitle}</div><div class="card-content"><table><thead><tr><th>${t.measurement}</th><th>${t.value} (${currentUnit==='cm'?t.unitCm:t.unitIn})</th><th>${t.explanation}</th></tr></thead><tbody>${Object.entries(pattern).map(([k,{value, numericFormula}])=>`<tr><td>${k}</td><td><strong>${formatDim(value)}</strong></td><td><button class="info-btn" data-rule="${k}" data-formula="${numericFormula.replace(/"/g,'&quot;')}"><i class="fas fa-info-circle"></i></button></td></tr>`).join('')}</tbody></table></div></div>`;
        document.getElementById('tables-container').innerHTML = bodyHtml + patternHtml;
        document.querySelectorAll('.info-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
            const pop=document.createElement('div'); pop.className='formula-popup';
            pop.innerHTML=`<div style="display:flex;justify-content:space-between;"><strong>القاعدة:</strong><span class="close-popup" style="cursor:pointer;">&times;</span></div><div>${btn.dataset.rule}</div><div style="margin-top:0.5rem;"><strong>المعادلة:</strong><br>${btn.dataset.formula}</div>`;
            document.body.appendChild(pop);
            pop.querySelector('.close-popup').onclick=()=>pop.remove();
            setTimeout(()=>pop.remove(),5000);
        }));
        drawPattern(meas);
        document.getElementById('instructions-content').innerHTML = generateInstructions(meas);
    }

    function buildSizeButtons() {
        let sizes = currentGender==='women'?Object.keys(womenSizes).map(Number):currentGender==='men'?Object.keys(menSizes).map(Number):currentGender==='kids'?Object.keys(kidsSizes).map(Number):Object.keys(infantSizes).map(Number);
        const container = document.getElementById('size-buttons-container');
        container.innerHTML = sizes.map(s=>`<div class="size-option ${s===currentSize?'selected':''}" data-size="${s}">${s}</div>`).join('');
        document.querySelectorAll('.size-option').forEach(opt=>opt.addEventListener('click',()=>{ currentSize=parseInt(opt.dataset.size); buildSizeButtons(); renderTables(); }));
    }

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('app-title').innerText = t.appTitle;
        document.getElementById('system-label').innerText = t.systemLabel;
        document.getElementById('gender-label').innerText = t.genderLabel;
        document.getElementById('unit-label').innerText = t.unitLabel;
        document.getElementById('size-number-label').innerText = t.sizeNumberLabel;
        document.getElementById('pattern-title').innerText = t.patternTitle;
        document.getElementById('instructions-title').innerText = t.instructionsTitle;
        document.getElementById('sleeve-type-label').innerText = t.sleeveTypeLabel;
        document.getElementById('school-label').innerText = t.schoolLabel;
        document.getElementById('footer-text').innerHTML = t.footer;
        document.querySelector('#gender-buttons button[data-gender="women"]').innerText = 'نساء';
        document.querySelector('#gender-buttons button[data-gender="men"]').innerText = 'رجال';
        document.querySelector('#gender-buttons button[data-gender="kids"]').innerText = 'أطفال';
        document.querySelector('#gender-buttons button[data-gender="infant"]').innerText = 'رضع';
        document.querySelectorAll('#unit-buttons .btn').forEach(btn=>btn.innerText=btn.dataset.unit==='cm'?t.unitCm:t.unitIn);
        buildSizeButtons();
        renderTables();
    }

    function switchGender(g) { currentGender=g; if(g==='women') currentSize=38; else if(g==='men') currentSize=48; else if(g==='kids') currentSize=6; else currentSize=6; buildSizeButtons(); renderTables(); }
    function switchUnit(u) { currentUnit=u; renderTables(); }
    function switchSystem(s) { currentSystem=s; buildSizeButtons(); renderTables(); }
    function exportExcel() { /* ... (نفس السابق) */ alert('تصدير Excel'); }
    function exportPNG() { const canvas=document.getElementById('patternCanvas'); const link=document.createElement('a'); link.download='pattern.png'; link.href=canvas.toDataURL(); link.click(); }
    function exportPDF() { alert('PDF'); }

    document.querySelectorAll('#gender-buttons .btn').forEach(btn=>btn.addEventListener('click',()=>switchGender(btn.dataset.gender)));
    document.querySelectorAll('#unit-buttons .btn').forEach(btn=>btn.addEventListener('click',()=>switchUnit(btn.dataset.unit)));
    document.getElementById('size-system').addEventListener('change',e=>switchSystem(e.target.value));
    document.getElementById('sleeve-type').addEventListener('change',e=>{ currentSleeveType=e.target.value; renderTables(); });
    document.getElementById('school-select').addEventListener('change',e=>{ currentSchool=e.target.value; renderTables(); });
    document.getElementById('lang-select').addEventListener('change',e=>{ currentLang=e.target.value; updateUI(); });
    document.getElementById('export-png').addEventListener('click',exportPNG);
    document.getElementById('export-excel').addEventListener('click',exportExcel);
    document.getElementById('export-pdf').addEventListener('click',exportPDF);

    function init() {
        updateUI();
        if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
        document.getElementById('theme-toggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); localStorage.setItem('darkMode',document.body.classList.contains('dark')); });
    }
    init();
</script>
