<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>موسوعة الأجيال – نظام رسم الباترون المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bezier-js@6.1.0/bezier.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2c5282; --secondary: #48bb78; --accent: #ed8936;
            --gray-light: #f7fafc; --gray: #cbd5e0; --dark: #2d3748;
            --white: #ffffff; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: var(--dark); direction: rtl; line-height: 1.5;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .header {
            background: linear-gradient(135deg, #1e3c72, #2c5282);
            color: white; padding: 2rem 1.5rem; border-radius: var(--radius);
            margin-bottom: 2rem; text-align: center;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
        .selection-card {
            background: var(--white); border-radius: var(--radius); padding: 1.5rem;
            margin-bottom: 2rem; box-shadow: var(--shadow);
        }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: flex-end; }
        .form-group { flex: 1; min-width: 180px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .form-group select, .form-group input {
            width: 100%; padding: 0.75rem; border: 2px solid var(--gray);
            border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 1rem;
            background: white; cursor: pointer;
        }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .type-buttons { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .type-btn {
            flex: 1; padding: 0.75rem 1rem; border: 2px solid var(--gray);
            background: var(--white); border-radius: 10px; cursor: pointer;
            font-weight: 600; transition: 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 0.5rem;
        }
        .type-btn.active { background: var(--secondary); border-color: var(--secondary); color: white; }
        .sizes-grid {
            display: flex; flex-wrap: wrap; gap: 0.75rem; max-height: 180px;
            overflow-y: auto; padding: 0.5rem; background: var(--gray-light);
            border-radius: 10px;
        }
        .size-option {
            padding: 0.5rem 1rem; background: white; border: 1px solid var(--gray);
            border-radius: 30px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .size-option:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .size-option.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .measurements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding: 0.5rem;
            background: var(--gray-light);
            border-radius: var(--radius);
        }
        .measurement-item {
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow);
        }
        .measurement-item label {
            flex: 1;
            font-weight: 600;
        }
        .measurement-item input {
            width: 100px;
            padding: 0.5rem;
            border: 1px solid var(--gray);
            border-radius: 6px;
            text-align: center;
        }
        .control-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); background: #1a3a5f; }
        .btn-secondary { background: var(--accent); }
        .btn-success { background: var(--secondary); }
        .info-bar {
            background: linear-gradient(90deg, var(--primary), #4299c1);
            color: white; padding: 1rem 1.5rem; border-radius: 10px; margin-bottom: 2rem;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .patterns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .pattern-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .pattern-card .card-header {
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .pattern-canvas-container {
            background: #fafafa;
            padding: 1rem;
            text-align: center;
            overflow-x: auto;
        }
        canvas {
            background: white;
            box-shadow: var(--shadow);
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .footer {
            text-align: center; padding: 2rem; margin-top: 2rem;
            color: var(--dark); border-top: 1px solid var(--gray);
        }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .patterns-grid { grid-template-columns: 1fr; }
            .measurements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-drafting-compass"></i> موسوعة الأجيال – نظام رسم الباترون المتكامل</h1>
        <p>رسم احترافي للأطفال، النساء، والرجال – مع أبعاد كاملة، خطوط إرشادية، ونوتشات دقيقة</p>
    </div>

    <div class="selection-card">
        <div class="row">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> النوع</label>
                <div class="type-buttons" id="type-buttons">
                    <button class="type-btn active" data-type="women">نساء</button>
                    <button class="type-btn" data-type="men">رجال</button>
                    <button class="type-btn" data-type="kids">أطفال</button>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-ruler"></i> المقاس الأوروبي (EU)</label>
                <div id="sizes-container" class="sizes-grid"></div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-chart-line"></i> الوحدة</label>
                <select id="unit-select">
                    <option value="cm">سم (cm)</option>
                    <option value="in">إنش (in)</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="show-measurements" checked>
                    <label for="show-measurements">إظهار القياسات على الرسم</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-darts" checked>
                    <label for="show-darts">إظهار البنسات (للنساء)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-seam" checked>
                    <label for="show-seam">إظهار بدل الخياطة (1.5 سم)</label>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-tshirt"></i> نوع الكم</label>
                <select id="sleeve-type">
                    <option value="basic">أساسي</option>
                    <option value="puff">منفوخ</option>
                    <option value="bell">جرس</option>
                    <option value="bishop">أسقف</option>
                    <option value="darted">تايلور</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-arrows-alt"></i> مقياس الرسم</label>
                <input type="range" id="scale-range" min="0.5" max="3" step="0.1" value="1.5">
                <span id="scale-value">1.5</span>
            </div>
        </div>

        <div class="measurements-grid" id="measurements-grid">
            <!-- 19 حقل إدخال ستتولد ديناميكياً -->
        </div>

        <div class="control-buttons">
            <button class="btn btn-success" id="generate-btn"><i class="fas fa-pencil-ruler"></i> رسم الباترون</button>
            <button class="btn btn-secondary" id="export-png"><i class="fas fa-download"></i> تصدير PNG</button>
            <button class="btn btn-secondary" id="print-btn"><i class="fas fa-print"></i> طباعة</button>
        </div>
    </div>

    <div id="info-bar" class="info-bar" style="display: none;">
        <div><i class="fas fa-tag"></i> النوع: <span id="type-name"></span></div>
        <div><i class="fas fa-ruler"></i> المقاس: <span id="size-value"></span></div>
        <div><i class="fas fa-chart-simple"></i> الوحدة: <span id="unit-name"></span></div>
    </div>

    <div class="patterns-grid" id="patterns-grid"></div>

    <div class="footer">
        <p>© 2025 – نظام رسم الباترون المتكامل – موسوعة الأجيال</p>
    </div>
</div>

<script>
    // ========================== الإعدادات العامة ==========================
    let currentType = "women";
    let currentSize = 38;
    let currentUnit = "cm";
    let showMeasurements = true;
    let showDarts = true;
    let showSeam = true;
    let sleeveType = "basic";
    let userScale = 1.5;

    // قائمة القياسات الـ19 (بنفس الترتيب)
    const measurementKeys = [
        "عرض الظهر", "طول الكتف", "طول الظهر", "طول الكم", "محيط الذراع",
        "محيط الأسوارة", "محيط الرقبة", "محيط الصدر", "محيط الخصر", "محيط الورك",
        "المسافة من الخصر إلى الورك", "المسافة من الخصر إلى الركبة", "طول الساق من الخصر إلى أسفل القدم",
        "طول التنورة / البنطلون", "طول الصدر", "محيط الإبط (دوران الإبط)",
        "المسافة من الخصر إلى الإبط", "المسافة من أعلى الكتف إلى الصدر",
        "المسافة بين الثديين"
    ];

    // قيم افتراضية (EU 38 للنساء)
    const defaultWomen38 = {
        "عرض الظهر": 36, "طول الكتف": 13.5, "طول الظهر": 40, "طول الكم": 58,
        "محيط الذراع": 30, "محيط الأسوارة": 22, "محيط الرقبة": 36, "محيط الصدر": 88,
        "محيط الخصر": 70, "محيط الورك": 96, "المسافة من الخصر إلى الورك": 20,
        "المسافة من الخصر إلى الركبة": 58, "طول الساق من الخصر إلى أسفل القدم": 108,
        "طول التنورة / البنطلون": 60, "طول الصدر": 38, "محيط الإبط (دوران الإبط)": 42,
        "المسافة من الخصر إلى الإبط": 28, "المسافة من أعلى الكتف إلى الصدر": 24,
        "المسافة بين الثديين": 18
    };

    // للرجال مرجع EU 48
    const defaultMen48 = {
        "عرض الظهر": 40, "طول الكتف": 15, "طول الظهر": 45, "طول الكم": 62,
        "محيط الذراع": 34, "محيط الأسوارة": 26, "محيط الرقبة": 40, "محيط الصدر": 96,
        "محيط الخصر": 84, "محيط الورك": 100, "المسافة من الخصر إلى الورك": 22,
        "المسافة من الخصر إلى الركبة": 60, "طول الساق من الخصر إلى أسفل القدم": 112,
        "طول التنورة / البنطلون": 108, "طول الصدر": 42, "محيط الإبط (دوران الإبط)": 48,
        "المسافة من الخصر إلى الإبط": 32, "المسافة من أعلى الكتف إلى الصدر": 26,
        "المسافة بين الثديين": 20
    };

    // الأطفال (الفئة 1=80 سم)
    const kidsBase80 = {
        "عرض الظهر": 23, "طول الكتف": 9, "طول الظهر": 22, "طول الكم": 28,
        "محيط الذراع": 18, "محيط الأسوارة": 14, "محيط الرقبة": 26, "محيط الصدر": 52,
        "محيط الخصر": 51, "محيط الورك": 54, "المسافة من الخصر إلى الورك": 12,
        "المسافة من الخصر إلى الركبة": 32, "طول الساق من الخصر إلى أسفل القدم": 62,
        "طول التنورة / البنطلون": 34, "طول الصدر": 24, "محيط الإبط (دوران الإبط)": 28,
        "المسافة من الخصر إلى الإبط": 16, "المسافة من أعلى الكتف إلى الصدر": 14,
        "المسافة بين الثديين": 10
    };

    // دوال استقراء المقاسات حسب النوع والمقاس
    function getMeasurementsForSize(type, size) {
        if (type === "women") {
            let diff = (size - 38) / 2;
            let base = defaultWomen38;
            let result = {};
            for (let key of measurementKeys) {
                let step = 0;
                if (key === "محيط الصدر" || key === "محيط الخصر" || key === "محيط الورك") step = 4;
                else if (key === "عرض الظهر" || key === "طول الظهر" || key === "طول الكم" || key === "طول الساق" || key === "طول التنورة / البنطلون") step = 0.8;
                else if (key === "طول الكتف" || key === "المسافة من أعلى الكتف إلى الصدر") step = 0.3;
                else if (key === "محيط الذراع" || key === "محيط الأسوارة" || key === "محيط الرقبة") step = 0.6;
                else if (key === "المسافة من الخصر إلى الورك") step = 0.2;
                else if (key === "المسافة من الخصر إلى الركبة") step = 0.8;
                else if (key === "طول الصدر" || key === "محيط الإبط") step = 0.8;
                else if (key === "المسافة من الخصر إلى الإبط") step = 0.5;
                else if (key === "المسافة بين الثديين") step = 0.2;
                result[key] = base[key] + diff * step;
            }
            return result;
        } else if (type === "men") {
            let diff = (size - 48) / 2;
            let base = defaultMen48;
            let result = {};
            for (let key of measurementKeys) {
                let step = 0;
                if (key === "محيط الصدر" || key === "محيط الخصر" || key === "محيط الورك") step = 4;
                else if (key === "عرض الظهر" || key === "طول الظهر" || key === "طول الكم" || key === "طول الساق" || key === "طول التنورة / البنطلون") step = 0.8;
                else if (key === "طول الكتف" || key === "المسافة من أعلى الكتف إلى الصدر") step = 0.3;
                else if (key === "محيط الذراع" || key === "محيط الأسوارة" || key === "محيط الرقبة") step = 0.6;
                else if (key === "المسافة من الخصر إلى الورك") step = 0.2;
                else if (key === "المسافة من الخصر إلى الركبة") step = 0.8;
                else if (key === "طول الصدر" || key === "محيط الإبط") step = 0.8;
                else if (key === "المسافة من الخصر إلى الإبط") step = 0.5;
                else if (key === "المسافة بين الثديين") step = 0.2;
                result[key] = base[key] + diff * step;
            }
            return result;
        } else { // kids
            let factor = (size - 1) / 16; // 0..1
            let base = kidsBase80;
            let result = {};
            for (let key of measurementKeys) {
                let growth = 0;
                if (key === "محيط الصدر") growth = 44;
                else if (key === "محيط الخصر") growth = 25;
                else if (key === "محيط الورك") growth = 44;
                else if (key === "عرض الظهر") growth = 16;
                else if (key === "طول الكتف") growth = 8;
                else if (key === "طول الظهر") growth = 16;
                else if (key === "طول الكم") growth = 32;
                else if (key === "محيط الذراع") growth = 16;
                else if (key === "محيط الأسوارة") growth = 16;
                else if (key === "محيط الرقبة") growth = 16;
                else if (key === "المسافة من الخصر إلى الورك") growth = 8;
                else if (key === "المسافة من الخصر إلى الركبة") growth = 32;
                else if (key === "طول الساق") growth = 64;
                else if (key === "طول التنورة / البنطلون") growth = 32;
                else if (key === "طول الصدر") growth = 16;
                else if (key === "محيط الإبط") growth = 16;
                else if (key === "المسافة من الخصر إلى الإبط") growth = 16;
                else if (key === "المسافة من أعلى الكتف إلى الصدر") growth = 8;
                else if (key === "المسافة بين الثديين") growth = 8;
                result[key] = base[key] + factor * growth;
            }
            return result;
        }
    }

    let currentMeasurements = getMeasurementsForSize("women", 38);

    function formatDim(value) {
        if (currentUnit === "in") return (value / 2.54).toFixed(2) + " in";
        return value.toFixed(1) + " سم";
    }

    // بناء حقول الإدخال
    function buildMeasurementFields() {
        const container = document.getElementById("measurements-grid");
        container.innerHTML = "";
        for (let key of measurementKeys) {
            const div = document.createElement("div");
            div.className = "measurement-item";
            div.innerHTML = `
                <label>${key}</label>
                <input type="number" step="0.5" value="${currentMeasurements[key].toFixed(1)}" data-key="${key}">
            `;
            container.appendChild(div);
        }
        document.querySelectorAll(".measurement-item input").forEach(input => {
            input.addEventListener("change", (e) => {
                const key = e.target.dataset.key;
                currentMeasurements[key] = parseFloat(e.target.value);
                drawAllPatterns();
            });
        });
    }

    function updateMeasurementsFromSize() {
        currentMeasurements = getMeasurementsForSize(currentType, currentSize);
        document.querySelectorAll(".measurement-item input").forEach(input => {
            const key = input.dataset.key;
            input.value = currentMeasurements[key].toFixed(1);
        });
        drawAllPatterns();
    }

    // ========================== دوال الرسم الأساسية (مستوحاة من pattern.service) ==========================
    function drawGrid(ctx, w, h, step=20) {
        ctx.save();
        ctx.strokeStyle = '#e9ecef';
        ctx.lineWidth = 0.5;
        for(let x=0; x<w; x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for(let y=0; y<h; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
        ctx.restore();
    }

    function drawDimension(ctx, x1, y1, x2, y2, offset, value, isHorizontal = true) {
        let p1, p2, textPos;
        const termSize = 4;
        if (isHorizontal) {
            const y = y1 + offset;
            p1 = { x: x1, y }; p2 = { x: x2, y };
            textPos = { x: (x1 + x2)/2, y: y + (offset > 0 ? 8 : -8) };
        } else {
            const x = x1 + offset;
            p1 = { x, y: y1 }; p2 = { x, y: y2 };
            textPos = { x: x + (offset > 0 ? 8 : -8), y: (y1 + y2)/2 };
        }
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.strokeStyle = '#6c757d'; ctx.lineWidth = 0.8; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        if (isHorizontal) {
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y-termSize); ctx.lineTo(p1.x, p1.y+termSize); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p2.x, p2.y-termSize); ctx.lineTo(p2.x, p2.y+termSize); ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(p1.x-termSize, p1.y); ctx.lineTo(p1.x+termSize, p1.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p2.x-termSize, p2.y); ctx.lineTo(p2.x+termSize, p2.y); ctx.stroke();
        }
        ctx.fillStyle = '#495057'; ctx.font = "12px 'Tajawal'";
        ctx.fillText(formatDim(value), textPos.x, textPos.y);
    }

    function drawNotch(ctx, x, y, angle) {
        const len = 5;
        const dx = Math.cos(angle) * len;
        const dy = Math.sin(angle) * len;
        ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
    }

    // رسم الكورساج الأمامي
    function drawFrontBodice(ctx, w, h, measurements) {
        const { "محيط الصدر": bust, "محيط الخصر": waist, "محيط الورك": hip,
                "طول الظهر": backLength, "طول الكتف": shoulder, "محيط الرقبة": neck,
                "المسافة من الخصر إلى الورك": waistToHip } = measurements;
        const bustEase = 2, waistEase = 2.5, hipEase = 1.5;
        const qBust = bust/4 + bustEase;
        const qWaist = waist/4 + waistEase;
        const qHip = hip/4 + hipEase;
        const armholeDepth = (bust/10) + 10.5;
        const waistline = backLength;
        const hipLine = waistline + waistToHip;
        const neckWidth = neck/6;
        const frontNeckDrop = neck/5;
        const shoulderSlope = 4.5;
        const chestWidth = bust/4 - 4;

        const points = {
            neckTop: { x: neckWidth, y: 0 },
            shoulderTip: { x: shoulder/2, y: shoulderSlope },
            neckDrop: { x: 0, y: frontNeckDrop },
            bustSide: { x: qBust, y: armholeDepth },
            waistCenter: { x: 0, y: waistline },
            waistSide: { x: qWaist, y: waistline },
            hipCenter: { x: 0, y: hipLine },
            hipSide: { x: qHip, y: hipLine },
            hemCenter: { x: 0, y: backLength },
            hemSide: { x: qHip, y: backLength },
            armholeLandmark: { x: chestWidth, y: armholeDepth }
        };

        ctx.save();
        ctx.translate(30,40);
        // المسار الرئيسي
        ctx.beginPath();
        ctx.moveTo(points.hemCenter.x*userScale, points.hemCenter.y*userScale);
        ctx.lineTo(points.waistCenter.x*userScale, points.waistCenter.y*userScale);
        ctx.lineTo(points.neckDrop.x*userScale, points.neckDrop.y*userScale);
        ctx.quadraticCurveTo((points.neckDrop.x+points.neckTop.x)*0.5*userScale, points.neckDrop.y*userScale,
                             points.neckTop.x*userScale, points.neckTop.y*userScale);
        ctx.lineTo(points.shoulderTip.x*userScale, points.shoulderTip.y*userScale);
        ctx.quadraticCurveTo((points.shoulderTip.x+points.armholeLandmark.x)*0.7*userScale,
                             (points.shoulderTip.y+points.armholeLandmark.y)*0.5*userScale,
                             points.bustSide.x*userScale, points.bustSide.y*userScale);
        ctx.quadraticCurveTo(points.bustSide.x*userScale,
                             (points.bustSide.y+points.waistSide.y)*0.4*userScale,
                             points.waistSide.x*userScale, points.waistSide.y*userScale);
        ctx.quadraticCurveTo(points.waistSide.x*userScale,
                             (points.waistSide.y+points.hipSide.y)*0.6*userScale,
                             points.hipSide.x*userScale, points.hipSide.y*userScale);
        ctx.lineTo(points.hemSide.x*userScale, points.hemSide.y*userScale);
        ctx.closePath();
        ctx.strokeStyle = "#2c5282";
        ctx.stroke();
        ctx.fillStyle = "rgba(44,82,130,0.05)";
        ctx.fill();

        // خطوط إرشادية
        if(showMeasurements){
            ctx.beginPath(); ctx.moveTo(0, points.bustSide.y*userScale); ctx.lineTo(points.bustSide.x*userScale, points.bustSide.y*userScale);
            ctx.strokeStyle = "#e53e3e"; ctx.setLineDash([5,5]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, points.waistSide.y*userScale); ctx.lineTo(points.waistSide.x*userScale, points.waistSide.y*userScale); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, points.hipSide.y*userScale); ctx.lineTo(points.hipSide.x*userScale, points.hipSide.y*userScale); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#e53e3e";
            ctx.fillText(`خط الصدر (${formatDim(armholeDepth)})`, points.bustSide.x*userScale+5, points.bustSide.y*userScale);
            ctx.fillText(`خط الخصر (${formatDim(waistline)})`, points.waistSide.x*userScale+5, points.waistSide.y*userScale);
            ctx.fillText(`خط الأرداف (${formatDim(hipLine)})`, points.hipSide.x*userScale+5, points.hipSide.y*userScale);
        }

        // أبعاد
        if(showMeasurements){
            drawDimension(ctx, 0, points.bustSide.y*userScale, points.bustSide.x*userScale, points.bustSide.y*userScale, -15, qBust, true);
            drawDimension(ctx, 0, points.waistSide.y*userScale, points.waistSide.x*userScale, points.waistSide.y*userScale, -18, qWaist, true);
            drawDimension(ctx, 0, points.hipSide.y*userScale, points.hipSide.x*userScale, points.hipSide.y*userScale, -21, qHip, true);
            drawDimension(ctx, 0, 0, 0, backLength*userScale, -12, backLength, false);
        }

        // بنسة (للنساء)
        if(showDarts && currentType === "women"){
            const waistReduction = qBust - qWaist;
            if(waistReduction > 1.5){
                const dartApexX = bust/10;
                const topDartTipY = armholeDepth + 3;
                const bottomDartTipY = waistline + 12;
                const dartLeg1X = dartApexX - waistReduction/2;
                const dartLeg2X = dartApexX + waistReduction/2;
                ctx.beginPath();
                ctx.moveTo(dartApexX*userScale, topDartTipY*userScale);
                ctx.lineTo(dartLeg1X*userScale, waistline*userScale);
                ctx.lineTo(dartApexX*userScale, bottomDartTipY*userScale);
                ctx.lineTo(dartLeg2X*userScale, waistline*userScale);
                ctx.closePath();
                ctx.strokeStyle = "#e53e3e"; ctx.stroke();
            }
        }

        // خط الثنية
        const grainX = qBust/2 * userScale;
        ctx.beginPath(); ctx.moveTo(grainX, 10); ctx.lineTo(grainX, backLength*userScale-10);
        ctx.strokeStyle="#000"; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(grainX-5,10); ctx.lineTo(grainX,5); ctx.lineTo(grainX+5,10); ctx.fill();

        ctx.fillStyle = "#1e3c72"; ctx.font = "bold 16px 'Tajawal'";
        ctx.fillText("الأمامي", 10, 30);
        ctx.fillStyle = "#666"; ctx.font = "12px 'Tajawal'";
        ctx.fillText("على ثنية القماش", 10, 55);
        ctx.fillText("قص 1", 10, 80);
        ctx.restore();
    }

    // دوال مماثلة للخلفي، الكم، التنورة، البنطلون (مبسطة لكنها تعطي هيكلاً كاملاً)
    function drawBackBodice(ctx, w, h, measurements) {
        // مشابه للأمامي مع اختلاف نزول الرقبة
        const { "محيط الصدر": bust, "محيط الخصر": waist, "محيط الورك": hip,
                "طول الظهر": backLength, "طول الكتف": shoulder, "محيط الرقبة": neck,
                "المسافة من الخصر إلى الورك": waistToHip } = measurements;
        const bustEase = 2, waistEase = 2.5, hipEase = 1.5;
        const qBust = bust/4 + bustEase;
        const qWaist = waist/4 + waistEase;
        const qHip = hip/4 + hipEase;
        const armholeDepth = (bust/10) + 10.5;
        const waistline = backLength;
        const hipLine = waistline + waistToHip;
        const neckWidth = neck/6;
        const backNeckDrop = neck/20;
        const shoulderSlope = 4.5;
        const backWidthDraft = bust/8 + 5.5;

        const points = {
            neckTop: { x: neckWidth, y: 0 },
            shoulderTip: { x: shoulder/2, y: shoulderSlope },
            neckDrop: { x: 0, y: backNeckDrop },
            bustSide: { x: qBust, y: armholeDepth },
            waistCenter: { x: 0, y: waistline },
            waistSide: { x: qWaist, y: waistline },
            hipCenter: { x: 0, y: hipLine },
            hipSide: { x: qHip, y: hipLine },
            hemCenter: { x: 0, y: backLength },
            hemSide: { x: qHip, y: backLength },
            armholeLandmark: { x: backWidthDraft, y: armholeDepth }
        };
        // رسم مماثل للأمامي (لنكرر كود مشابه للاختصار)
        ctx.save();
        ctx.translate(30,40);
        ctx.beginPath();
        ctx.moveTo(points.hemCenter.x*userScale, points.hemCenter.y*userScale);
        ctx.lineTo(points.waistCenter.x*userScale, points.waistCenter.y*userScale);
        ctx.lineTo(points.neckDrop.x*userScale, points.neckDrop.y*userScale);
        ctx.quadraticCurveTo((points.neckDrop.x+points.neckTop.x)*0.5*userScale, points.neckDrop.y*userScale,
                             points.neckTop.x*userScale, points.neckTop.y*userScale);
        ctx.lineTo(points.shoulderTip.x*userScale, points.shoulderTip.y*userScale);
        ctx.quadraticCurveTo((points.shoulderTip.x+points.armholeLandmark.x)*0.6*userScale,
                             (points.shoulderTip.y+points.armholeLandmark.y)*0.5*userScale,
                             points.bustSide.x*userScale, points.bustSide.y*userScale);
        ctx.quadraticCurveTo(points.bustSide.x*userScale,
                             (points.bustSide.y+points.waistSide.y)*0.4*userScale,
                             points.waistSide.x*userScale, points.waistSide.y*userScale);
        ctx.quadraticCurveTo(points.waistSide.x*userScale,
                             (points.waistSide.y+points.hipSide.y)*0.6*userScale,
                             points.hipSide.x*userScale, points.hipSide.y*userScale);
        ctx.lineTo(points.hemSide.x*userScale, points.hemSide.y*userScale);
        ctx.closePath();
        ctx.strokeStyle = "#2c5282";
        ctx.stroke();
        ctx.fillStyle = "rgba(44,82,130,0.05)";
        ctx.fill();
        // خطوط إرشادية مشابهة
        if(showMeasurements){
            ctx.beginPath(); ctx.moveTo(0, points.bustSide.y*userScale); ctx.lineTo(points.bustSide.x*userScale, points.bustSide.y*userScale);
            ctx.strokeStyle = "#e53e3e"; ctx.setLineDash([5,5]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, points.waistSide.y*userScale); ctx.lineTo(points.waistSide.x*userScale, points.waistSide.y*userScale); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, points.hipSide.y*userScale); ctx.lineTo(points.hipSide.x*userScale, points.hipSide.y*userScale); ctx.stroke();
            ctx.setLineDash([]);
        }
        const grainX = qBust/2 * userScale;
        ctx.beginPath(); ctx.moveTo(grainX, 10); ctx.lineTo(grainX, backLength*userScale-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(grainX-5,10); ctx.lineTo(grainX,5); ctx.lineTo(grainX+5,10); ctx.fill();
        ctx.fillStyle = "#1e3c72"; ctx.font = "bold 16px 'Tajawal'";
        ctx.fillText("الخلفي", 10, 30);
        ctx.fillStyle = "#666"; ctx.font = "12px 'Tajawal'";
        ctx.fillText("على ثنية القماش", 10, 55);
        ctx.fillText("قص 1", 10, 80);
        ctx.restore();
    }

    function drawSleeve(ctx, w, h, measurements) {
        const { "محيط الذراع": armCirc, "طول الكم": sleeveLength, "محيط الأسوارة": cuff } = measurements;
        const armholeDepth = (measurements["محيط الصدر"]/4)-2;
        const sleeveCap = armholeDepth/3;
        let sleeveWidth = armCirc + 6;
        if(sleeveType === "puff") sleeveWidth *= 1.5;
        if(sleeveType === "bell") sleeveWidth *= 2.5;
        if(sleeveType === "bishop") sleeveWidth *= 1.8;
        const cuffWidth = sleeveType === "bell" ? sleeveWidth*0.9 : cuff;
        ctx.save();
        ctx.translate(30,40);
        ctx.beginPath();
        ctx.moveTo(0, sleeveLength*userScale);
        ctx.lineTo(0, sleeveCap*userScale);
        ctx.quadraticCurveTo(sleeveWidth/2*userScale, 0, sleeveWidth*userScale, sleeveCap*userScale);
        ctx.lineTo(sleeveWidth*userScale, sleeveLength*userScale);
        if(sleeveType !== "bell") ctx.lineTo(0, sleeveLength*userScale);
        ctx.closePath();
        ctx.strokeStyle = "#2c5282";
        ctx.stroke();
        ctx.fillStyle = "rgba(44,82,130,0.05)";
        ctx.fill();
        if(showMeasurements){
            drawDimension(ctx, 0, sleeveCap*userScale, sleeveWidth*userScale, sleeveCap*userScale, -12, sleeveWidth, true);
            drawDimension(ctx, sleeveWidth/2*userScale, 0, sleeveWidth/2*userScale, sleeveLength*userScale, 15, sleeveLength, false);
        }
        const grainX = sleeveWidth/2 * userScale;
        ctx.beginPath(); ctx.moveTo(grainX, 10); ctx.lineTo(grainX, sleeveLength*userScale-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(grainX-5,10); ctx.lineTo(grainX,5); ctx.lineTo(grainX+5,10); ctx.fill();
        ctx.fillStyle = "#1e3c72"; ctx.font = "bold 16px 'Tajawal'";
        ctx.fillText("الكم", 10, 30);
        ctx.fillStyle = "#666"; ctx.font = "12px 'Tajawal'";
        ctx.fillText("قص 2", 10, 55);
        ctx.restore();
    }

    function drawSkirt(ctx, w, h, measurements) {
        const { "محيط الخصر": waist, "محيط الورك": hip, "المسافة من الخصر إلى الورك": waistToHip, "طول التنورة / البنطلون": skirtLength } = measurements;
        const qWaist = waist/4 + 1;
        const qHip = hip/4 + 1.5;
        ctx.save();
        ctx.translate(30,40);
        ctx.beginPath();
        ctx.moveTo(0, skirtLength*userScale);
        ctx.lineTo(0, 0);
        ctx.lineTo(qWaist*userScale, 0);
        ctx.quadraticCurveTo(qWaist*userScale, waistToHip*0.4*userScale, qHip*userScale, waistToHip*userScale);
        ctx.lineTo(qHip*userScale, skirtLength*userScale);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = "rgba(44,82,130,0.05)";
        ctx.fill();
        if(showMeasurements){
            drawDimension(ctx, 0, 0, qWaist*userScale, 0, -8, qWaist, true);
            drawDimension(ctx, 0, skirtLength*userScale, qHip*userScale, skirtLength*userScale, 8, qHip, true);
            drawDimension(ctx, 0, 0, 0, skirtLength*userScale, -10, skirtLength, false);
        }
        const grainX = qWaist/2 * userScale;
        ctx.beginPath(); ctx.moveTo(grainX, 10); ctx.lineTo(grainX, skirtLength*userScale-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(grainX-5,10); ctx.lineTo(grainX,5); ctx.lineTo(grainX+5,10); ctx.fill();
        ctx.fillStyle = "#1e3c72"; ctx.font = "bold 16px 'Tajawal'";
        ctx.fillText("التنورة", 10, 30);
        ctx.fillStyle = "#666"; ctx.font = "12px 'Tajawal'";
        ctx.fillText("قص 1 على الثنية", 10, 55);
        ctx.restore();
    }

    function drawPants(ctx, w, h, measurements, isFront = true) {
        const { "محيط الخصر": waist, "محيط الورك": hip, "المسافة من الخصر إلى الورك": waistToHip, "طول الساق من الخصر إلى أسفل القدم": legLength } = measurements;
        const qWaist = waist/4 + 0.5;
        const qHip = hip/4 + (isFront?0.5:1.5);
        const crotchDepth = legLength * 0.3; // تقدير
        const frontCrotch = waist/8;
        const backCrotch = waist/6;
        const hemWidth = qHip - 2;
        ctx.save();
        ctx.translate(30,40);
        const points = {
            waistSide: { x: 0, y: 0 },
            waistCenter: { x: qWaist, y: 0 },
            crotchPoint: { x: (isFront?frontCrotch:backCrotch), y: crotchDepth },
            hemCenter: { x: hemWidth, y: legLength }
        };
        ctx.beginPath();
        ctx.moveTo(0, legLength*userScale);
        ctx.lineTo(0, 0);
        ctx.lineTo(points.waistCenter.x*userScale, 0);
        ctx.lineTo(points.crotchPoint.x*userScale, points.crotchPoint.y*userScale);
        ctx.lineTo(points.hemCenter.x*userScale, legLength*userScale);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = "rgba(44,82,130,0.05)";
        ctx.fill();
        if(showMeasurements){
            drawDimension(ctx, 0, 0, points.waistCenter.x*userScale, 0, -8, qWaist, true);
            drawDimension(ctx, 0, 0, 0, legLength*userScale, -10, legLength, false);
            drawDimension(ctx, points.crotchPoint.x*userScale, points.crotchPoint.y*userScale, points.hemCenter.x*userScale, points.crotchPoint.y*userScale, 8, points.hemCenter.x-points.crotchPoint.x, true);
        }
        const grainX = (points.waistCenter.x + points.hemCenter.x)/2 * userScale;
        ctx.beginPath(); ctx.moveTo(grainX, 10); ctx.lineTo(grainX, legLength*userScale-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(grainX-5,10); ctx.lineTo(grainX,5); ctx.lineTo(grainX+5,10); ctx.fill();
        ctx.fillStyle = "#1e3c72"; ctx.font = "bold 16px 'Tajawal'";
        ctx.fillText(isFront?"البنطلون الأمامي":"البنطلون الخلفي", 10, 30);
        ctx.fillStyle = "#666"; ctx.font = "12px 'Tajawal'";
        ctx.fillText(isFront?"قص 2":"قص 2 (على ثنية)", 10, 55);
        ctx.restore();
    }

    // ========================== رسم جميع القطع ==========================
    function drawAllPatterns() {
        const grid = document.getElementById("patterns-grid");
        grid.innerHTML = `
            <div class="pattern-card"><div class="card-header"><i class="fas fa-tshirt"></i> الكورساج الأمامي</div><div class="pattern-canvas-container"><canvas id="frontCanvas" width="500" height="500"></canvas></div></div>
            <div class="pattern-card"><div class="card-header"><i class="fas fa-tshirt"></i> الكورساج الخلفي</div><div class="pattern-canvas-container"><canvas id="backCanvas" width="500" height="500"></canvas></div></div>
            <div class="pattern-card"><div class="card-header"><i class="fas fa-hand-peace"></i> الكم</div><div class="pattern-canvas-container"><canvas id="sleeveCanvas" width="500" height="500"></canvas></div></div>
            <div class="pattern-card"><div class="card-header"><i class="fas fa-female"></i> التنورة</div><div class="pattern-canvas-container"><canvas id="skirtCanvas" width="500" height="500"></canvas></div></div>
            <div class="pattern-card"><div class="card-header"><i class="fas fa-vest-patches"></i> البنطلون الأمامي</div><div class="pattern-canvas-container"><canvas id="pantsFrontCanvas" width="500" height="500"></canvas></div></div>
            <div class="pattern-card"><div class="card-header"><i class="fas fa-vest-patches"></i> البنطلون الخلفي</div><div class="pattern-canvas-container"><canvas id="pantsBackCanvas" width="500" height="500"></canvas></div></div>
        `;
        const frontCtx = document.getElementById("frontCanvas").getContext("2d");
        const backCtx = document.getElementById("backCanvas").getContext("2d");
        const sleeveCtx = document.getElementById("sleeveCanvas").getContext("2d");
        const skirtCtx = document.getElementById("skirtCanvas").getContext("2d");
        const pantsFrontCtx = document.getElementById("pantsFrontCanvas").getContext("2d");
        const pantsBackCtx = document.getElementById("pantsBackCanvas").getContext("2d");

        drawGrid(frontCtx, 500, 500);
        drawFrontBodice(frontCtx, 500, 500, currentMeasurements);
        drawGrid(backCtx, 500, 500);
        drawBackBodice(backCtx, 500, 500, currentMeasurements);
        drawGrid(sleeveCtx, 500, 500);
        drawSleeve(sleeveCtx, 500, 500, currentMeasurements);
        drawGrid(skirtCtx, 500, 500);
        drawSkirt(skirtCtx, 500, 500, currentMeasurements);
        drawGrid(pantsFrontCtx, 500, 500);
        drawPants(pantsFrontCtx, 500, 500, currentMeasurements, true);
        drawGrid(pantsBackCtx, 500, 500);
        drawPants(pantsBackCtx, 500, 500, currentMeasurements, false);
    }

    // ========================== أحداث الواجهة ==========================
    function buildSizeList() {
        let sizes = [];
        if(currentType === "women") for(let i=32; i<=56; i+=2) sizes.push(i);
        else if(currentType === "men") for(let i=34; i<=58; i+=2) sizes.push(i);
        else for(let i=1; i<=17; i++) sizes.push(i);
        const container = document.getElementById("sizes-container");
        container.innerHTML = sizes.map(s => `<div class="size-option ${s===currentSize?'selected':''}" data-size="${s}">${s} ${currentType==="kids"?"الفئة":""}</div>`).join("");
        document.querySelectorAll(".size-option").forEach(opt => opt.addEventListener("click", () => {
            currentSize = parseInt(opt.dataset.size);
            buildSizeList();
            updateMeasurementsFromSize();
            drawAllPatterns();
            document.getElementById("size-value").innerText = currentSize + (currentType==="kids"?" (الفئة)":"");
        }));
    }

    function switchType(type) {
        currentType = type;
        if(type === "women") currentSize = 38;
        else if(type === "men") currentSize = 48;
        else currentSize = 1;
        buildSizeList();
        updateMeasurementsFromSize();
        drawAllPatterns();
        document.getElementById("type-name").innerText = type==="women"?"نساء":(type==="men"?"رجال":"أطفال");
        document.getElementById("size-value").innerText = currentSize + (type==="kids"?" (الفئة)":"");
    }

    function switchUnit() { currentUnit = document.getElementById("unit-select").value; drawAllPatterns(); }
    function toggleShowMeasurements() { showMeasurements = document.getElementById("show-measurements").checked; drawAllPatterns(); }
    function toggleShowDarts() { showDarts = document.getElementById("show-darts").checked; drawAllPatterns(); }
    function toggleShowSeam() { showSeam = document.getElementById("show-seam").checked; drawAllPatterns(); }
    function changeSleeveType() { sleeveType = document.getElementById("sleeve-type").value; drawAllPatterns(); }
    function changeScale() { userScale = parseFloat(document.getElementById("scale-range").value); document.getElementById("scale-value").innerText = userScale; drawAllPatterns(); }

    document.getElementById("type-buttons").querySelectorAll(".type-btn").forEach(btn => btn.addEventListener("click", () => {
        document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        switchType(btn.dataset.type);
    }));
    document.getElementById("unit-select").addEventListener("change", switchUnit);
    document.getElementById("show-measurements").addEventListener("change", toggleShowMeasurements);
    document.getElementById("show-darts").addEventListener("change", toggleShowDarts);
    document.getElementById("show-seam").addEventListener("change", toggleShowSeam);
    document.getElementById("sleeve-type").addEventListener("change", changeSleeveType);
    document.getElementById("scale-range").addEventListener("input", changeScale);
    document.getElementById("generate-btn").addEventListener("click", () => drawAllPatterns());
    document.getElementById("export-png").addEventListener("click", () => {
        const canvas = document.querySelector("canvas");
        if(canvas){
            const link = document.createElement("a");
            link.download = "pattern.png";
            link.href = canvas.toDataURL();
            link.click();
        }
    });
    document.getElementById("print-btn").addEventListener("click", () => window.print());

    buildMeasurementFields();
    buildSizeList();
    drawAllPatterns();
    document.getElementById("info-bar").style.display = "flex";
    document.getElementById("type-name").innerText = "نساء";
    document.getElementById("size-value").innerText = "38";
    document.getElementById("unit-name").innerText = currentUnit === "cm" ? "سم" : "إنش";
</script>
</body>
</html>
