<div class="container">
    <div class="header">
        <h1><i class="fas fa-drafting-compass"></i> <span id="app-title">موسوعة الأجيال – مدارس رسم الباترون (النسخة النهائية)</span></h1>

            <button id="theme-toggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="selection-card">
        <div class="row">
            <div class="form-group"><label id="system-label">نظام المقاسات</label><select id="size-system"><option value="eu">🇪🇺 EU</option><option value="us">🇺🇸 US</option><option value="arab">🇸🇦 Arab</option><option value="asian">🇯🇵 Asian</option></select></div>
            <div class="form-group"><label id="gender-label">الجنس</label><div class="btn-group" id="gender-buttons"><button class="btn active" data-gender="women">نساء</button><button class="btn" data-gender="men">رجال</button><button class="btn" data-gender="kids">أطفال</button><button class="btn" data-gender="infant">رضع</button></div></div>
            <div class="form-group"><label id="unit-label">الوحدة</label><div class="btn-group" id="unit-buttons"><button class="btn active" data-unit="cm">سم</button><button class="btn" data-unit="in">إنش</button></div></div>
        </div>
        <div class="form-group"><label id="size-number-label">رقم المقاس</label><div id="size-buttons-container" class="size-buttons"></div></div>
        <div class="row">
            <div class="form-group"><label id="school-label">مدرسة الرسم</label><select id="school-select">

                <option value="asian">🇯🇵 الآسيوية (Bunka / كورية)</option>
            </select></div>
            <div class="form-group"><label id="sleeve-type-label">نوع الكم</label><select id="sleeve-type"><option value="basic">أساسي (قطعة واحدة)</option><option value="twopiece">تايلور (قطعتين)</option><option value="raglan">ريكلان (راجلان)</option></select></div>
        </div>
    </div>

    <div id="tables-container" class="tables-container"></div>

    <div class="card encyclopedia-card">
        <div class="card-header"><span><i class="fas fa-book-open"></i> <span id="encyclopedia-title">تعليمات رسم الباترون حسب المدرسة</span></span></div>
        <div class="encyclopedia-content" id="encyclopedia-content"></div>
    </div>

    function infantMeasurements(month) {
        let base = {
            chest: 42, waist: 41, hip: 43, backWidth: 16, shoulder: 6, backLength: 19, sleeveLength: 22,
            armCirc: 15, cuffCirc: 11, neckCirc: 27, waistToHip: 10, waistToKnee: 26, legLength: 45,
            skirtLength: 28, chestLength: 20, armholeCirc: 27, waistToArmpit: 14, shoulderToBust: 9,
            bustPointDist: 7, armholeDepth: 12, thighCirc: 27, kneeCirc: 18, ankleCirc: 12, crotchHeight: 13, sideLength: 44
        };
        let factor = 1 + (month-1) * 0.04;
        let res = {};
        for (let k in base) res[k] = base[k] * factor;
        return res;
    }

    // ========== الراحة والخياطة حسب المدرسة (القيم المحدثة) ==========

    function computeSchoolValues(meas) {

        let neckWidth, frontNeckDrop, backNeckDrop = 2.2, shoulderSlope, armholeDepth;

                frontNeckDrop = (neck / 5) + 1;

        <li>عرض الرقبة = ${s.neckWidth.toFixed(1)} سم (حسب المدرسة).</li>
        <li>نزول الرقبة الأمامي = ${s.frontNeckDrop.toFixed(1)} سم، الخلفي = ${s.backNeckDrop.toFixed(1)} سم.</li>
        <li>ميل الكتف = ${s.shoulderSlope} سم، طول الكتف = ${meas.shoulder} سم.</li>
        <li>عمق الإبط = ${s.armholeDepth.toFixed(1)} سم.</li>
        <li>عرض الصدر الأمامي = ${(((meas.bust??meas.chest)/2 - meas.backWidth)/2 + ease.chest/4 + seam.side).toFixed(1)} سم، عرض الصدر الخلفي = ${(meas.backWidth/2 + seam.side).toFixed(1)} سم.</li></ul>
        <h3>👖 الجزء السفلي</h3>
        <ul><li>عرض الأمام/الخلف = ربع الورك + راحة + خياطة = ${(meas.hip/4 + ease.hip/4 + seam.side).toFixed(1)} سم.</li>
        <li>ارتفاع السرج = ${meas.crotchHeight.toFixed(1)} سم.</li>
        <li>عرض خط السرج الأمامي = (محيط الورك ÷ 16) + راحة السرج + خياطة = ${(meas.hip/16 + ease.crotch/2 + seam.side).toFixed(1)} سم.</li>
        <li>عرض خط السرج الخلفي = (محيط الورك ÷ 8) + راحة السرج + خياطة = ${(meas.hip/8 + ease.crotch + seam.side).toFixed(1)} سم.</li></ul>
        <h3>🧵 الكم (${sleeveName})</h3>
        <ul><li>ارتفاع رأس الكم = عمق الإبط × 0.82 = ${(s.armholeDepth*0.82).toFixed(1)} سم.</li>
        <li>نصف عرض الكم = (محيط الذراع ÷ 2) + راحة الذراع ÷ 2 + خياطة = ${((meas.armCirc/2) + ease.arm/2 + seam.side).toFixed(1)} سم.</li>
        <li>نصف محيط الأسوارة = (محيط الأسوارة ÷ 2) + راحة الأسوارة ÷ 2 + خياطة = ${((meas.cuffCirc/2) + ease.cuff/2 + seam.side).toFixed(1)} سم.</li></ul>`;
    }

    function buildSizeButtons() {
        const sizes = getSizeList();
        const container = document.getElementById('size-buttons-container');
        container.innerHTML = sizes.map(s => `<div class="size-option ${s === currentSize ? 'selected' : ''}" data-size="${s}">${mapSizeBySystem(s)}</div>`).join('');
        document.querySelectorAll('.size-option').forEach(opt => opt.addEventListener('click', () => { currentSize = parseFloat(opt.dataset.size); buildSizeButtons(); renderTables(); }));
    }

    function updateUI() {
        const t = { ar: { unitCm: "سم", unitIn: "إنش" }, en: { unitCm: "cm", unitIn: "in" }, es: { unitCm: "cm", unitIn: "pulg" }, de: { unitCm: "cm", unitIn: "zoll" } }[currentLang];
        document.getElementById('app-title').innerText = currentLang === 'ar' ? "موسوعة الأجيال – مدارس رسم الباترون (النسخة النهائية)" : "Al-Ajyal Encyclopedia – Professional Pattern Drafting";
        document.getElementById('system-label').innerText = currentLang === 'ar' ? "نظام المقاسات" : "Size System";
        document.getElementById('gender-label').innerText = currentLang === 'ar' ? "الجنس" : "Gender";
        document.getElementById('unit-label').innerText = currentLang === 'ar' ? "الوحدة" : "Unit";
        document.getElementById('size-number-label').innerText = currentLang === 'ar' ? "رقم المقاس" : "Size Number";
        document.getElementById('school-label').innerText = currentLang === 'ar' ? "مدرسة الرسم" : "Drafting School";
        document.getElementById('sleeve-type-label').innerText = currentLang === 'ar' ? "نوع الكم" : "Sleeve Type";
        document.getElementById('encyclopedia-title').innerHTML = currentLang === 'ar' ? "تعليمات رسم الباترون حسب المدرسة" : "Pattern Drafting Instructions by School";
        document.getElementById('footer-text').innerHTML = currentLang === 'ar' ? "جميع الحسابات وفق المدارس العالمية – اضغط على ℹ️ لعرض المعادلة والخطوات التفصيلية" : "All calculations according to global schools – click ℹ️ for formula and detailed steps";
        document.getElementById('export-text').innerHTML = currentLang === 'ar' ? "تصدير Excel (القياسات التفصيلية + الباترون)" : "Export Excel (Detailed + Pattern)";
        const genderMap = { women: { ar: 'نساء', en: 'Women', es: 'Mujeres', de: 'Frauen' }, men: { ar: 'رجال', en: 'Men', es: 'Hombres', de: 'Männer' }, kids: { ar: 'أطفال', en: 'Kids', es: 'Niños', de: 'Kinder' }, infant: { ar: 'رضع', en: 'Infant', es: 'Bebés', de: 'Säuglinge' } };
        document.querySelectorAll('#gender-buttons .btn').forEach(btn => { btn.innerText = genderMap[btn.dataset.gender][currentLang] || btn.dataset.gender; });
        document.querySelectorAll('#unit-buttons .btn').forEach(btn => btn.innerText = btn.dataset.unit === 'cm' ? t.unitCm : t.unitIn);
        buildSizeButtons();
        renderTables();
    }

    function exportToExcel() {
        const meas = getMeasurements();
        const pattern = computePatternValues(meas);
        const detailedValues = getDetailedValues(meas);
        const detailedData = [["#", "القياس", `القيمة (${currentUnit === 'cm' ? 'سم' : 'إنش'})`]];
        for (let i=0; i<detailedNames.length; i++) detailedData.push([i+1, detailedNames[i], formatDim(detailedValues[i])]);
        const patternNames = [
            "طول الظهر", "عرض الظهر (نصف)", "طول الكتف", "ميلان الكتف", "ربع محيط الرقبة",
            "عرض حفرة الرقبة الأمامية", "عرض حفرة الرقبة الخلفية", "نزول الرقبة الأمامية", "نزول الرقبة الخلفية",
            "طول حردة الإبط (ربع)", "عمق حردة الإبط", "ربع محيط الصدر", "عرض الصدر الأمامي", "عرض الصدر الخلفي",
            "ربع محيط الخصر", "ربع محيط الورك", "ارتفاع الورك", "طول الصدر", "المسافة من الخصر إلى الإبط",
            "المسافة بين الثديين", "طول البنطلون", "طول التنورة", "ربع محيط الفخذ", "ربع محيط الركبة",
            "ربع محيط الكاحل", "ارتفاع السرج", "عرض خط السرج الأمامي", "عرض خط السرج الخلفي", "طول الساق",
            "المسافة من الخصر إلى الركبة", "طول الكم", "نصف محيط الذراع", "ارتفاع رأس الكم", "نصف عرض الكم",
            "نصف محيط الأسوارة", "طول الرسغ إلى المرفق", "طول المرفق إلى الكتف"
        ];
        const patternData = [["#", "القياس", "القيمة", "المعادلة"]];
        for (let i=0; i<37; i++) patternData.push([i+1, patternNames[i], formatDim(pattern.values[i]), pattern.formulas[i+1]]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detailedData), "المقاسات التفصيلية");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(patternData), "مقاسات الباترون الأساسي");
        XLSX.writeFile(wb, `patterns_${currentGender}_${currentSize}.xlsx`);
    }

    function switchGender(gender) { currentGender = gender; currentSize = getSizeList()[0]; document.querySelectorAll('#gender-buttons .btn').forEach(btn => btn.classList.remove('active')); document.querySelector(`#gender-buttons .btn[data-gender="${gender}"]`).classList.add('active'); buildSizeButtons(); renderTables(); }
    function switchUnit(unit) { currentUnit = unit; document.querySelectorAll('#unit-buttons .btn').forEach(btn => btn.classList.remove('active')); document.querySelector(`#unit-buttons .btn[data-unit="${unit}"]`).classList.add('active'); renderTables(); }

    document.querySelectorAll('#gender-buttons .btn').forEach(btn => btn.addEventListener('click', () => switchGender(btn.dataset.gender)));
    document.querySelectorAll('#unit-buttons .btn').forEach(btn => btn.addEventListener('click', () => switchUnit(btn.dataset.unit)));
    document.getElementById('size-system').addEventListener('change', e => { currentSystem = e.target.value; buildSizeButtons(); renderTables(); });
    document.getElementById('sleeve-type').addEventListener('change', e => { currentSleeveType = e.target.value; renderTables(); });
    document.getElementById('school-select').addEventListener('change', e => { currentSchool = e.target.value; renderTables(); });
    document.getElementById('lang-select').addEventListener('change', e => { currentLang = e.target.value; updateUI(); });
    document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);

    function init() {
        updateUI();
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); });
    }
    init();
</script>
</body>
</html>
