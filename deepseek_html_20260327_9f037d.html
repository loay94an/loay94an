            --border-color: #cbd5e0;
        }
        body.dark {
            --primary: #4299c1;
            --primary-light: #63b3ed;
            --secondary: #68d391;
            --accent: #f6ad55;
            --gray-light: #2d3748;
            --gray: #4a5568;
            --dark: #f7fafc;
            --white: #1a202c;
            --bg-page: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --border-color: #4a5568;

            color: var(--text-color);

            font-weight: 500;
            transition: 0.2s;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .btn.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }
        .size-buttons {

            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 160px;
            overflow-y: auto;
            padding: 0.5rem;
            background: var(--gray-light);
            border-radius: 10px;
            margin-top: 0.5rem;

        .size-option {
            padding: 0.3rem 0.8rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

            color: white;
        }

            margin-bottom: 1.5rem;

        </div>
    </div>

        <div class="row">
            <div class="form-group">
                <label id="system-label">نظام المقاسات</label>
                <select id="size-system">

                    <option value="us">🇺🇸 US</option>
                    <option value="arab">🇸🇦 Arab</option>
                    <option value="asian">🇯🇵 Asian</option>
                </select>
            </div>
            <div class="form-group">
                <label id="gender-label">الجنس</label>
                <div class="btn-group" id="gender-buttons">
                    <button class="btn active" data-gender="women">نساء</button>
                    <button class="btn" data-gender="men">رجال</button>
                    <button class="btn" data-gender="kids">أطفال</button>
                    <button class="btn" data-gender="infant">رضع</button>
                </div>
            </div>
            <div class="form-group">
                <label id="unit-label">الوحدة</label>

                    <button class="btn active" data-unit="cm">سم</button>
                    <button class="btn" data-unit="in">إنش</button>

            </div>
        </div>
        <div class="form-group">
            <label id="size-number-label">رقم المقاس</label>
            <div id="size-buttons-container" class="size-buttons"></div>
        </div>
        <div class="row" id="calculation-methods">

    </div>

    <div id="tables-container" class="tables-container"></div>

        </div>
        <div class="export-buttons">

        </div>
    </div>

    </div>
</div>

        else shoulderSlope = 4.5;

        const backWidthPat = chestQuarter - 2;

        const hipQuarter = hip / 4;
        const hipHeight = waistToHip;

    function drawPattern(meas) {
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.save();

        const chest = meas.chest;
        const backLength = meas.backLength;
        const neck = meas.neckCirc;
        let armholeDepth;
        if (currentMethods.armholeDepth === 'direct') armholeDepth = meas.armholeDepth;
        else armholeDepth = (chest / 4) - 2;
        let frontNeckDrop;
        if (currentMethods.frontNeckDrop === 'direct') frontNeckDrop = meas.frontNeckDrop || (neck / 5);
        else frontNeckDrop = neck / 5;
        const shoulderSlope = currentMethods.shoulderSlope === 'direct' ? (meas.shoulderSlope || 4.5) : 4.5;
        const neckWidth = (neck / 6) + 0.5;
        const chestQuarter = chest / 4;
        const waistQuarter = (meas.waist / 4);
        const waistToHip = meas.waistToHip;

        // عرض وطول الباترون
        const width = (chest / 2) + 3;
        const height = backLength + 1.5;

        const scale = Math.min((w-100) / width, (h-100) / height, 3.2);
        const offsetX = 50, offsetY = 50;
        const rectW = width * scale;
        const rectH = height * scale;

        // المستطيل الأساسي
        ctx.strokeStyle = '#2c5282';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(offsetX, offsetY, rectW, rectH);
        ctx.fillStyle = 'rgba(44,82,130,0.05)';
        ctx.fillRect(offsetX, offsetY, rectW, rectH);

        // خط منتصف الأمام
        const midX = offsetX + rectW/2;
        ctx.beginPath();
        ctx.moveTo(midX, offsetY);
        ctx.lineTo(midX, offsetY + rectH);
        ctx.strokeStyle = '#000';
        ctx.setLineDash([5,5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // خط الصدر
        const chestLineY = offsetY + armholeDepth * scale;
        ctx.beginPath();
        ctx.moveTo(offsetX, chestLineY);
        ctx.lineTo(offsetX + rectW, chestLineY);
        ctx.strokeStyle = '#e53e3e';
        ctx.setLineDash([5,5]);
        ctx.stroke();

        // خط الخصر
        const waistLineY = offsetY + backLength * scale;
        ctx.beginPath();
        ctx.moveTo(offsetX, waistLineY);
        ctx.lineTo(offsetX + rectW, waistLineY);
        ctx.stroke();

        // خط الورك
        const hipLineY = offsetY + (backLength - waistToHip) * scale;
        ctx.beginPath();
        ctx.moveTo(offsetX, hipLineY);
        ctx.lineTo(offsetX + rectW, hipLineY);
        ctx.stroke();
        ctx.setLineDash([]);

        // حردة الرقبة
        const neckTopX = offsetX + neckWidth * scale;
        const neckTopY = offsetY;
        const neckDropX = offsetX + rectW/2;
        const neckDropY = offsetY + frontNeckDrop * scale;
        ctx.beginPath();
        ctx.moveTo(neckTopX, neckTopY);
        ctx.quadraticCurveTo(offsetX + rectW/2, offsetY, neckDropX, neckDropY);
        ctx.stroke();

        // خط الكتف
        const shoulderEndX = offsetX + (shoulderSlope + 2) * scale;
        const shoulderEndY = offsetY + shoulderSlope * scale;
        ctx.beginPath();
        ctx.moveTo(neckTopX, neckTopY);
        ctx.lineTo(shoulderEndX, shoulderEndY);
        ctx.stroke();

        // كتابة الأبعاد
        ctx.fillStyle = '#e53e3e';
        ctx.font = "12px 'Tajawal'";
        ctx.fillText(`عرض: ${formatDim(width)}`, offsetX + rectW/2, offsetY - 5);
        ctx.fillText(`طول: ${formatDim(height)}`, offsetX + rectW + 5, offsetY + rectH/2);
        ctx.fillText(`خط الصدر: ${formatDim(armholeDepth)}`, offsetX + rectW + 5, chestLineY);
        ctx.fillText(`خط الخصر: ${formatDim(backLength)}`, offsetX + rectW + 5, waistLineY);
        ctx.fillText(`خط الورك: ${formatDim(waistToHip)}`, offsetX + rectW + 5, hipLineY);
        ctx.fillStyle = '#1e3c72';
        ctx.font = "bold 14px 'Tajawal'";
        ctx.fillText("ربع الباترون الأمامي (على ثنية القماش)", offsetX, offsetY - 15);
        ctx.restore();
    }

                <div class="card-content">
                    <table>
                        <thead><tr><th>${t.measurement}</th><th>${t.value} (${currentUnit === 'cm' ? t.unitCm : t.unitIn})</th><th>${t.explanation}</th></tr></thead>
                        <tbody>
                            ${Object.entries(pattern).map(([key, {value, numericFormula}]) => `
                                <tr>
                                    <td>${key}</td>
                                    <td><strong>${formatDim(value)}</strong></td>
                                    <td><button class="info-btn" data-rule="${key}" data-formula="${numericFormula.replace(/"/g, '&quot;')}"><i class="fas fa-info-circle"></i></button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        document.getElementById('tables-container').innerHTML = bodyTableHtml + patternTableHtml;

        document.querySelectorAll('.info-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rule = btn.dataset.rule;
                const formula = btn.dataset.formula;
                const popup = document.createElement('div');
                popup.className = 'formula-popup';
                popup.innerHTML = `
                    <div style="display:flex; justify-content:space-between;"><strong>القاعدة:</strong><span class="close-popup" style="cursor:pointer;">&times;</span></div>
                    <div>${rule}</div>
                    <div style="margin-top:0.5rem;"><strong>المعادلة بالأرقام:</strong><br>${formula}</div>
                `;
                document.body.appendChild(popup);
                const close = popup.querySelector('.close-popup');
                const closePopup = () => popup.remove();
                close.addEventListener('click', closePopup);
                setTimeout(() => popup.remove(), 5000);
            });
        });

        drawPattern(meas);
    }

    function updateMethodsDropdowns() {
        const container = document.getElementById('calculation-methods');
        const t = translations[currentLang];
        container.innerHTML = `
            <div class="form-group">
                <label>${t.armholeDepthMethod}</label>
                <select id="method-armhole">
                    <option value="formula" ${currentMethods.armholeDepth === 'formula' ? 'selected' : ''}>${t.formula}</option>
                    <option value="direct" ${currentMethods.armholeDepth === 'direct' ? 'selected' : ''}>${t.direct}</option>
                </select>
            </div>
            <div class="form-group">
                <label>${t.neckDropMethod}</label>
                <select id="method-frontneck">
                    <option value="formula" ${currentMethods.frontNeckDrop === 'formula' ? 'selected' : ''}>${t.formula}</option>
                    <option value="direct" ${currentMethods.frontNeckDrop === 'direct' ? 'selected' : ''}>${t.direct}</option>
                </select>
            </div>
            <div class="form-group">
                <label>${t.backNeckDropMethod}</label>
                <select id="method-backneck">
                    <option value="formula" ${currentMethods.backNeckDrop === 'formula' ? 'selected' : ''}>${t.formula}</option>
                    <option value="direct" ${currentMethods.backNeckDrop === 'direct' ? 'selected' : ''}>${t.direct}</option>
                </select>
            </div>
            <div class="form-group">
                <label>${t.shoulderSlopeMethod}</label>
                <select id="method-shoulderslope">
                    <option value="formula" ${currentMethods.shoulderSlope === 'formula' ? 'selected' : ''}>${t.formula}</option>
                    <option value="direct" ${currentMethods.shoulderSlope === 'direct' ? 'selected' : ''}>${t.direct}</option>
                </select>
            </div>
        `;
        document.getElementById('method-armhole').addEventListener('change', (e) => { currentMethods.armholeDepth = e.target.value; renderTables(); });
        document.getElementById('method-frontneck').addEventListener('change', (e) => { currentMethods.frontNeckDrop = e.target.value; renderTables(); });
        document.getElementById('method-backneck').addEventListener('change', (e) => { currentMethods.backNeckDrop = e.target.value; renderTables(); });
        document.getElementById('method-shoulderslope').addEventListener('change', (e) => { currentMethods.shoulderSlope = e.target.value; renderTables(); });
    }

    function switchGender(gender) {
        currentGender = gender;
        if (currentGender === 'women') currentSize = 38;
        else if (currentGender === 'men') currentSize = 48;
        else if (currentGender === 'kids') currentSize = 6;
        else currentSize = 6;
        buildSizeButtons();
        renderTables();
        document.querySelectorAll('#gender-buttons .btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`#gender-buttons .btn[data-gender="${gender}"]`).classList.add('active');
    }

    function switchUnit(unit) {
        currentUnit = unit;
        renderTables();
        document.querySelectorAll('#unit-buttons .btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`#unit-buttons .btn[data-unit="${unit}"]`).classList.add('active');
    }

    function switchSystem(system) {
        currentSystem = system;
        buildSizeButtons();
        renderTables();
    }

    function exportExcel() {
        const meas = getMeasurements();
        const pattern = computePattern(meas);
        const t = translations[currentLang];
        const measurementNamesLocal = measurementTranslations[currentLang] || measurementTranslations.ar;
        const measValues = [
            meas.backWidth, meas.shoulderLength, meas.backLength, meas.sleeveLength,
            meas.armCirc, meas.cuffCirc, meas.neckCirc, meas.chest, meas.waist,
            meas.hip, meas.waistToHip, meas.waistToKnee, meas.legLength,
            (currentGender === 'women' ? meas.skirtLength : (currentGender === 'men' ? meas.pantsLength : meas.skirtLength)),
            meas.chestLength, meas.armholeCirc, meas.waistToArmpit,
            (currentGender === 'women' ? meas.shoulderToBust : (currentGender === 'men' ? meas.shoulderToChest : meas.shoulderToBust)),
            (currentGender === 'women' ? meas.bustPointDist : (currentGender === 'men' ? meas.chestPointDist : meas.bustPointDist))
        ];
        const bodyData = measurementNamesLocal.map((name, i) => [name, formatDim(measValues[i])]);
        const patternData = Object.entries(pattern).map(([key, {value, numericFormula}]) => [key, formatDim(value), numericFormula]);
        const wsData = [
            [t.bodyTableTitle],
            [t.measurement, t.value],
            ...bodyData,
            [],
            [t.patternTableTitle],
            [t.measurement, t.value, t.formula],
            ...patternData
        ];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Pattern');
        XLSX.writeFile(wb, `pattern_${currentGender}_${currentSize}.xlsx`);
    }

    function exportPNG() {
        const canvas = document.getElementById('patternCanvas');
        const link = document.createElement('a');
        link.download = `pattern_${currentGender}_${currentSize}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    function exportPDF() {
        const element = document.getElementById('tables-container');
        const opt = {
            margin: 0.5,
            filename: `pattern_${currentGender}_${currentSize}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // الأحداث
    document.querySelectorAll('#gender-buttons .btn').forEach(btn => btn.addEventListener('click', () => switchGender(btn.dataset.gender)));
    document.querySelectorAll('#unit-buttons .btn').forEach(btn => btn.addEventListener('click', () => switchUnit(btn.dataset.unit)));
    document.getElementById('size-system').addEventListener('change', (e) => switchSystem(e.target.value));
    document.getElementById('lang-select').addEventListener('change', (e) => {
        currentLang = e.target.value;
        updateUI();
        updateMethodsDropdowns();
    });
    document.getElementById('export-excel').addEventListener('click', exportExcel);
    document.getElementById('export-png').addEventListener('click', exportPNG);
    document.getElementById('export-pdf').addEventListener('click', exportPDF);

    function init() {
        updateUI();
        updateMethodsDropdowns();
        renderTables();
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        });
    }
    init();
</script>
</body>
</html>
