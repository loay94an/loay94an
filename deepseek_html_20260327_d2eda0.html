<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>موسوعة الأجيال – نظام الباترون الأساسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        :root {
            --primary: #2c5282;
            --primary-light: #4299c1;
            --secondary: #48bb78;
            --accent: #ed8936;
            --gray-light: #f7fafc;
            --gray: #cbd5e0;
            --dark: #2d3748;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
            --bg-page: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #cbd5e0;
        }
        body.dark {
            --primary: #4299c1;
            --primary-light: #63b3ed;
            --secondary: #68d391;
            --accent: #f6ad55;
            --gray-light: #2d3748;
            --gray: #4a5568;
            --dark: #f7fafc;
            --white: #1a202c;
            --bg-page: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --border-color: #4a5568;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-page);
            color: var(--text-color);
            direction: rtl;
            padding: 1rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .lang-select, .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            color: white;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .theme-toggle {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        /* Buttons row */
        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 180px;
        }
        .btn-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary);
        }
        .btn-group .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .btn.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }
        .size-buttons {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .size-buttons .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 180px;
            overflow-y: auto;
            padding: 0.25rem;
        }
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .card-header {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1rem;
            font-weight: 600;
        }
        .card-content {
            padding: 1rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.6rem 0.4rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background: var(--gray-light);
            color: var(--primary);
        }
        .info-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--primary);
            transition: 0.2s;
        }
        .info-btn:hover {
            color: var(--accent);
        }
        /* Modal for rule explanation */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            width: 320px;
            max-width: 90%;
            padding: 1.2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            direction: rtl;
            position: relative;
        }
        .modal-content .close-modal {
            position: absolute;
            left: 1rem;
            top: 0.8rem;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--accent);
        }
        .modal-content .rule-text {
            margin-top: 0.5rem;
            font-weight: 500;
        }
        .modal-content .formula-numbers {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--secondary);
            background: var(--gray-light);
            padding: 0.5rem;
            border-radius: 8px;
        }
        .export-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .export-group {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            text-align: center;
            flex: 1;
            min-width: 200px;
        }
        .export-group h4 {
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .export-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .export-btn {
            background: var(--gray-light);
            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-color);
        }
        .footer {
            text-align: center;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--gray);
        }
        @media (max-width: 768px) {
            .tables-grid {
                grid-template-columns: 1fr;
            }
            .btn-group {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-drafting-compass"></i> <span id="app-title">موسوعة الأجيال – نظام الباترون الأساسي</span></h1>
        <div class="header-controls">
            <select id="lang-select" class="lang-select">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
            <button id="theme-toggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="buttons-row">
        <div class="btn-group">
            <label id="system-label">نظام المقاسات</label>
            <div class="btns" id="system-buttons">
                <button class="btn active" data-system="eu">🇪🇺 EU</button>
                <button class="btn" data-system="us">🇺🇸 US</button>
                <button class="btn" data-system="arab">🇸🇦 Arab</button>
                <button class="btn" data-system="asian">🇯🇵 Asian</button>
            </div>
        </div>
        <div class="btn-group">
            <label id="gender-label">الجنس</label>
            <div class="btns" id="gender-buttons">
                <button class="btn active" data-gender="women">نساء</button>
                <button class="btn" data-gender="men">رجال</button>
                <button class="btn" data-gender="kids">أطفال</button>
            </div>
        </div>
        <div class="btn-group">
            <label id="unit-label">الوحدة</label>
            <div class="btns" id="unit-buttons">
                <button class="btn active" data-unit="cm">سم (cm)</button>
                <button class="btn" data-unit="in">إنش (in)</button>
            </div>
        </div>
    </div>

    <div class="size-buttons">
        <label id="size-label">اختر المقاس</label>
        <div id="size-buttons-container" class="btns"></div>
    </div>

    <div id="tables-container" class="tables-grid"></div>

    <div class="export-section">
        <div class="export-group">
            <h4 id="export-body-title">مقاسات الجسم</h4>
            <div class="export-buttons">
                <button class="export-btn" id="export-body-pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="export-btn" id="export-body-png"><i class="fas fa-image"></i> PNG</button>
                <button class="export-btn" id="export-body-excel"><i class="fas fa-file-excel"></i> Excel</button>
            </div>
        </div>
        <div class="export-group">
            <h4 id="export-pattern-title">مقاسات الباترون</h4>
            <div class="export-buttons">
                <button class="export-btn" id="export-pattern-pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="export-btn" id="export-pattern-png"><i class="fas fa-image"></i> PNG</button>
                <button class="export-btn" id="export-pattern-excel"><i class="fas fa-file-excel"></i> Excel</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p id="footer-text">جميع الحسابات وفق المنهج العلمي – اضغط على أيقونة <i class="fas fa-info-circle"></i> بجانب القياس لرؤية شرح القاعدة والمعادلة بالأرقام</p>
    </div>
</div>

<script>
    // ======================== البيانات الأساسية (EU مرجع) ========================
    const womenBaseEU = {
        chest: 88, waist: 70, hip: 96, backWidth: 36, shoulderLength: 13.5,
        backLength: 40, sleeveLength: 58, armCirc: 30, cuffCirc: 22, neckCirc: 36,
        waistToHip: 20, waistToKnee: 58, legLength: 108, skirtLength: 60,
        chestLength: 38, armholeCirc: 42, waistToArmpit: 28, shoulderToBust: 24, bustPointDist: 18
    };
    const menBaseEU = {
        chest: 96, waist: 84, hip: 100, backWidth: 40, shoulderLength: 15,
        backLength: 45, sleeveLength: 62, armCirc: 34, cuffCirc: 26, neckCirc: 40,
        waistToHip: 22, waistToKnee: 60, legLength: 112, pantsLength: 108,
        chestLength: 42, armholeCirc: 48, waistToArmpit: 32, shoulderToChest: 26, chestPointDist: 20
    };
    const kidsAgeToHeight = {
        1:80,2:86,3:92,4:98,5:104,6:110,7:116,8:122,9:128,10:134,11:140,12:146,13:152,14:158
    };
    const kidsDataFull = {
        80:{ chest:52, waist:51, hip:54, backWidth:23, shoulderLength:9, backLength:22, sleeveLength:28, armCirc:18, cuffCirc:14, neckCirc:26, waistToHip:12, waistToKnee:32, legLength:62, skirtLength:34, chestLength:24, armholeCirc:28, waistToArmpit:16, shoulderToBust:14, bustPointDist:10 },
        86:{ chest:54, waist:52, hip:56, backWidth:24, shoulderLength:9.5, backLength:23, sleeveLength:30, armCirc:19, cuffCirc:15, neckCirc:27, waistToHip:12.5, waistToKnee:34, legLength:66, skirtLength:36, chestLength:25, armholeCirc:29, waistToArmpit:17, shoulderToBust:14.5, bustPointDist:10.5 },
        92:{ chest:56, waist:53, hip:58, backWidth:25, shoulderLength:10, backLength:24, sleeveLength:32, armCirc:20, cuffCirc:16, neckCirc:28, waistToHip:13, waistToKnee:36, legLength:70, skirtLength:38, chestLength:26, armholeCirc:30, waistToArmpit:18, shoulderToBust:15, bustPointDist:11 },
        98:{ chest:58, waist:54, hip:60, backWidth:26, shoulderLength:10.5, backLength:25, sleeveLength:34, armCirc:21, cuffCirc:17, neckCirc:29, waistToHip:13.5, waistToKnee:38, legLength:74, skirtLength:40, chestLength:27, armholeCirc:31, waistToArmpit:19, shoulderToBust:15.5, bustPointDist:11.5 },
        104:{ chest:60, waist:55, hip:62, backWidth:27, shoulderLength:11, backLength:26, sleeveLength:36, armCirc:22, cuffCirc:18, neckCirc:30, waistToHip:14, waistToKnee:40, legLength:78, skirtLength:42, chestLength:28, armholeCirc:32, waistToArmpit:20, shoulderToBust:16, bustPointDist:12 },
        110:{ chest:62, waist:56, hip:64, backWidth:28, shoulderLength:11.5, backLength:27, sleeveLength:38, armCirc:23, cuffCirc:19, neckCirc:31, waistToHip:14.5, waistToKnee:42, legLength:82, skirtLength:44, chestLength:29, armholeCirc:33, waistToArmpit:21, shoulderToBust:16.5, bustPointDist:12.5 },
        116:{ chest:64, waist:57, hip:66, backWidth:29, shoulderLength:12, backLength:28, sleeveLength:40, armCirc:24, cuffCirc:20, neckCirc:32, waistToHip:15, waistToKnee:44, legLength:86, skirtLength:46, chestLength:30, armholeCirc:34, waistToArmpit:22, shoulderToBust:17, bustPointDist:13 },
        122:{ chest:66, waist:58, hip:68, backWidth:30, shoulderLength:12.5, backLength:29, sleeveLength:42, armCirc:25, cuffCirc:21, neckCirc:33, waistToHip:15.5, waistToKnee:46, legLength:90, skirtLength:48, chestLength:31, armholeCirc:35, waistToArmpit:23, shoulderToBust:17.5, bustPointDist:13.5 },
        128:{ chest:68, waist:60, hip:70, backWidth:31, shoulderLength:13, backLength:30, sleeveLength:44, armCirc:26, cuffCirc:22, neckCirc:34, waistToHip:16, waistToKnee:48, legLength:94, skirtLength:50, chestLength:32, armholeCirc:36, waistToArmpit:24, shoulderToBust:18, bustPointDist:14 },
        134:{ chest:70, waist:62, hip:72, backWidth:32, shoulderLength:13.5, backLength:31, sleeveLength:46, armCirc:27, cuffCirc:23, neckCirc:35, waistToHip:16.5, waistToKnee:50, legLength:98, skirtLength:52, chestLength:33, armholeCirc:37, waistToArmpit:25, shoulderToBust:18.5, bustPointDist:14.5 },
        140:{ chest:72, waist:64, hip:74, backWidth:33, shoulderLength:14, backLength:32, sleeveLength:48, armCirc:28, cuffCirc:24, neckCirc:36, waistToHip:17, waistToKnee:52, legLength:102, skirtLength:54, chestLength:34, armholeCirc:38, waistToArmpit:26, shoulderToBust:19, bustPointDist:15 },
        146:{ chest:76, waist:66, hip:78, backWidth:34, shoulderLength:14.5, backLength:33, sleeveLength:50, armCirc:29, cuffCirc:25, neckCirc:37, waistToHip:17.5, waistToKnee:54, legLength:106, skirtLength:56, chestLength:35, armholeCirc:39, waistToArmpit:27, shoulderToBust:19.5, bustPointDist:15.5 },
        152:{ chest:80, waist:68, hip:82, backWidth:35, shoulderLength:15, backLength:34, sleeveLength:52, armCirc:30, cuffCirc:26, neckCirc:38, waistToHip:18, waistToKnee:56, legLength:110, skirtLength:58, chestLength:36, armholeCirc:40, waistToArmpit:28, shoulderToBust:20, bustPointDist:16 },
        158:{ chest:84, waist:70, hip:86, backWidth:36, shoulderLength:15.5, backLength:35, sleeveLength:54, armCirc:31, cuffCirc:27, neckCirc:39, waistToHip:18.5, waistToKnee:58, legLength:114, skirtLength:60, chestLength:37, armholeCirc:41, waistToArmpit:29, shoulderToBust:20.5, bustPointDist:16.5 },
        164:{ chest:88, waist:72, hip:90, backWidth:37, shoulderLength:16, backLength:36, sleeveLength:56, armCirc:32, cuffCirc:28, neckCirc:40, waistToHip:19, waistToKnee:60, legLength:118, skirtLength:62, chestLength:38, armholeCirc:42, waistToArmpit:30, shoulderToBust:21, bustPointDist:17 },
    };

    // تحويلات الأنظمة
    function womenSizeToEU(system, size) {
        if(system==='eu') return size;
        if(system==='us') { let m={4:34,6:36,8:38,10:40,12:42,14:44,16:46,18:48,20:50,22:52,24:54,26:56}; return m[size]||38; }
        if(system==='arab') return size;
        if(system==='asian') return size-4;
        return size;
    }
    function menSizeToEU(system, size) {
        if(system==='eu') return size;
        if(system==='us') { let m={30:40,32:42,34:44,36:46,38:48,40:50,42:52,44:54,46:56,48:58,50:60,52:62}; return m[size]||48; }
        if(system==='arab') return size;
        if(system==='asian') return size-4;
        return size;
    }

    // دوال الحصول على القياسات
    function getWomenMeasurements(system, size) {
        let eu = womenSizeToEU(system, size);
        let diff = (eu-38)/2;
        let factor = system==='asian'?0.97:(system==='arab'?1.02:1);
        const chest = (womenBaseEU.chest + diff*4)*factor;
        const waist = (womenBaseEU.waist + diff*4)*factor;
        const hip = (womenBaseEU.hip + diff*4)*factor;
        const backWidth = (womenBaseEU.backWidth + diff*1.2)*factor;
        const shoulderLength = (womenBaseEU.shoulderLength + diff*0.3)*factor;
        const backLength = (womenBaseEU.backLength + diff*0.8)*factor;
        const sleeveLength = (womenBaseEU.sleeveLength + diff*0.8)*factor;
        const armCirc = (womenBaseEU.armCirc + diff*0.8)*factor;
        const cuffCirc = (womenBaseEU.cuffCirc + diff*0.6)*factor;
        const neckCirc = (womenBaseEU.neckCirc + diff*0.8)*factor;
        const waistToHip = (womenBaseEU.waistToHip + diff*0.2)*factor;
        const waistToKnee = (womenBaseEU.waistToKnee + diff*0.8)*factor;
        const legLength = (womenBaseEU.legLength + diff*1.2)*factor;
        const skirtLength = (womenBaseEU.skirtLength + diff*0.8)*factor;
        const chestLength = (womenBaseEU.chestLength + diff*0.8)*factor;
        const armholeCirc = (womenBaseEU.armholeCirc + diff*1.2)*factor;
        const waistToArmpit = (womenBaseEU.waistToArmpit + diff*0.5)*factor;
        const shoulderToBust = (womenBaseEU.shoulderToBust + diff*0.3)*factor;
        const bustPointDist = (womenBaseEU.bustPointDist + diff*0.2)*factor;
        return { chest,waist,hip,backWidth,shoulderLength,backLength,sleeveLength,armCirc,cuffCirc,neckCirc,waistToHip,waistToKnee,legLength,skirtLength,chestLength,armholeCirc,waistToArmpit,shoulderToBust,bustPointDist };
    }
    function getMenMeasurements(system, size) {
        let eu = menSizeToEU(system, size);
        let diff = (eu-48)/2;
        let factor = system==='asian'?0.97:(system==='arab'?1.02:1);
        const chest = (menBaseEU.chest + diff*4)*factor;
        const waist = (menBaseEU.waist + diff*4)*factor;
        const hip = (menBaseEU.hip + diff*4)*factor;
        const backWidth = (menBaseEU.backWidth + diff*1.2)*factor;
        const shoulderLength = (menBaseEU.shoulderLength + diff*0.3)*factor;
        const backLength = (menBaseEU.backLength + diff*0.8)*factor;
        const sleeveLength = (menBaseEU.sleeveLength + diff*0.8)*factor;
        const armCirc = (menBaseEU.armCirc + diff*0.8)*factor;
        const cuffCirc = (menBaseEU.cuffCirc + diff*0.6)*factor;
        const neckCirc = (menBaseEU.neckCirc + diff*0.8)*factor;
        const waistToHip = (menBaseEU.waistToHip + diff*0.2)*factor;
        const waistToKnee = (menBaseEU.waistToKnee + diff*0.8)*factor;
        const legLength = (menBaseEU.legLength + diff*1.2)*factor;
        const pantsLength = (menBaseEU.pantsLength + diff*0.8)*factor;
        const chestLength = (menBaseEU.chestLength + diff*0.8)*factor;
        const armholeCirc = (menBaseEU.armholeCirc + diff*1.2)*factor;
        const waistToArmpit = (menBaseEU.waistToArmpit + diff*0.5)*factor;
        const shoulderToChest = (menBaseEU.shoulderToChest + diff*0.3)*factor;
        const chestPointDist = (menBaseEU.chestPointDist + diff*0.2)*factor;
        return { chest,waist,hip,backWidth,shoulderLength,backLength,sleeveLength,armCirc,cuffCirc,neckCirc,waistToHip,waistToKnee,legLength,pantsLength,chestLength,armholeCirc,waistToArmpit,shoulderToChest,chestPointDist };
    }
    function getKidsMeasurements(system, age) {
        let height = kidsAgeToHeight[age]||80;
        let meas = kidsDataFull[height]||kidsDataFull[80];
        let factor = system==='asian'?0.96:(system==='arab'?1.02:1);
        let scaled = {};
        for(let k in meas) scaled[k]=meas[k]*factor;
        // تعديلات تناسب العمر
        let ageFactor = 1 + (age-1)*0.025;
        scaled.chest *= ageFactor;
        scaled.waist *= (1+(age-1)*0.02);
        scaled.hip *= ageFactor;
        scaled.backLength *= (1+(age-1)*0.018);
        scaled.shoulderLength *= (1+(age-1)*0.02);
        scaled.sleeveLength *= (1+(age-1)*0.022);
        scaled.neckCirc *= (1+(age-1)*0.015);
        scaled.legLength *= (1+(age-1)*0.03);
        scaled.skirtLength *= (1+(age-1)*0.03);
        scaled.waistToHip *= (1+(age-1)*0.01);
        return scaled;
    }

    // حساب الباترون مع المعادلات
    function calculatePatternMeasurements(meas, type) {
        const chest = meas.chest;
        const waist = meas.waist;
        const hip = meas.hip;
        const neck = meas.neckCirc;

            <div class="formula-numbers"><strong>${translations[currentLang].formulaNumbers || 'المعادلة بالأرقام:'}</strong><br>${numericFormula}</div>

        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        activeModal = overlay;
        modal.querySelector('.close-modal').addEventListener('click', () => {

    async function exportAsPDF(tableId, title) {
        const element = document.getElementById(tableId);
        if(!element) return;
        const canvas = await html2canvas(element, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 190;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
        pdf.save(`${title}.pdf`);
    }
    async function exportAsPNG(tableId, title) {
        const element = document.getElementById(tableId);
        if(!element) return;
        const canvas = await html2canvas(element, { scale: 2 });
        const link = document.createElement('a');
        link.download = `${title}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    function exportAsExcel(tableId, title) {
        const table = document.querySelector(`#${tableId} table`);
        if(!table) return;
        const ws = XLSX.utils.table_to_sheet(table);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, title);
        XLSX.writeFile(wb, `${title}.xlsx`);
    }

        "ميل الكتف": "ميل الكتف = 4 سم (ثابت)",
        "المسافة بين الثديين/الحلمات": "المسافة بين الثديين = مقاس مباشر",
        "المسافة من الكتف إلى الصدر": "المسافة من الكتف إلى الصدر = مقاس مباشر",
        "عمق الرقبة الخلفية": "عمق الرقبة الخلفية = نزول الرقبة الخلفية + 1"
    };

    // تهيئة
    buildSizeButtons();
    renderTables();
    updateUI();
    // تطبيق الوضع الليلي من localStorage إن وجد
    if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', isDark);
    });
</script>
